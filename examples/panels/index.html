<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组件动效面板</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18181b; }
    main { max-width: 1060px; margin: auto; }
    .panel { height: 560px; background: #f8f9fa; border: 1px solid #e9eaed; border-radius: 36px; box-shadow: 0 12px 34px rgba(20, 20, 30, .045); padding: 24px; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
    nav { margin-top: 24px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 13px; }
    select { padding: 8px 12px; background: #fff; border: 1px solid #e1e2e6; border-radius: 8px; color: inherit; font: inherit; }
    a { color: #71717a; text-decoration: none; }
    @media (max-width: 620px) { body { padding: 16px; } .panel { padding: 8px; border-radius: 24px; height: 620px; } }
  </style>
</head>
<body>
  <main>
    <div class="panel" id="panel"><iframe id="componentFrame" title="组件动效"></iframe></div>
    <nav><select id="componentPicker" aria-label="选择组件"></select><a id="sourceLink" target="_blank" rel="noopener">打开源码</a></nav>
  </main>
  <script>
    const components = [
      ['button', '基础按钮'], ['action-button', '异步按钮'], ['split-button', '分割按钮'],
      ['button-group', '按钮组'], ['floating-button-group', '浮动工具栏'],
      ['expanding-button-group', '展开按钮组'], ['copy-button', '复制按钮'],
      ['icon-morph', '图标切换'], ['confirm-morph', '原地确认']
    ];
    const picker = document.getElementById('componentPicker');
    const frame = document.getElementById('componentFrame');
    const base = '../../skills/component-motion-tree/assets/style-1/';
    picker.replaceChildren(...components.map(([id, label]) => new Option(label, id)));
    function show(id) {
      if (!components.some(([key]) => key === id)) id = 'button';
      picker.value = id;
      frame.src = base + id + '/index.html?embed=true&theme=light';
      document.getElementById('sourceLink').href = base + id + '/index.html';
      history.replaceState(null, '', '?component=' + id);
    }
    // 仅改变展示容器，不改写参考源码及其交互。
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      const style = doc.createElement('style');
      style.textContent = `
        html, body { background: transparent !important; }
        .hint-caption, .hint-text, .stage-hint, .stage-caption { display: none !important; }
        body { zoom: 1.15; }
        .arc-stage { margin-top: 0 !important; }
      `;
      doc.head.append(style);
      frame.dataset.ready = 'true';
    });
    picker.addEventListener('change', () => { frame.dataset.ready = 'false'; show(picker.value); });
    show(new URLSearchParams(location.search).get('component'));
  </script>
</body>
</html>
