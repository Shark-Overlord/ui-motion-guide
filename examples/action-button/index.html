<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>使用 skill 前后 · 异步按钮改造</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #fff; color: #18181b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 860px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    article { border: 1px solid #e6e7eb; border-radius: 12px; background: #f8f9fa; overflow: hidden; }
    header { padding: 20px 20px 0; text-align: center; font-size: 14px; font-weight: 500; color: #71717a; }
    iframe { display: block; width: 100%; height: 200px; border: 0; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .actions button { padding: 9px 14px; background: #fff; color: #18181b; border: 1px solid #d6d6dd; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
    .actions button:focus-visible { outline: 2px solid #18181b; outline-offset: 3px; }
    @media (max-width: 620px) { body { padding: 24px 16px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="grid" id="motionComparison">
      <article><header>Before</header><iframe src="before.html" title="改造前的静态按钮"></iframe></article>
      <article><header>After</header><iframe src="after.html?embed=1" title="使用 skill 后的异步按钮" id="afterFrame"></iframe></article>
    </div>
    <div class="actions"><button id="success">播放成功流程</button><button id="failure">播放失败流程</button><button id="reset">恢复初始状态</button></div>
  </main>
  <script>
    const after = document.getElementById('afterFrame');
    const send = data => after.contentWindow.postMessage({ type: 'MOTION_DEMO', ...data }, location.origin);
    document.getElementById('success').addEventListener('click', () => send({ command: 'run', result: 'success' }));
    document.getElementById('failure').addEventListener('click', () => send({ command: 'run', result: 'error' }));
    document.getElementById('reset').addEventListener('click', () => send({ command: 'reset' }));
  </script>
</body>
</html>
