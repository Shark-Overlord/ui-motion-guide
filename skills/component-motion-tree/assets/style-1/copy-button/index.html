<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc UI · Copy button (copy-button)</title>
  <style>
    :root {
      /* ── Arc UI Motion Tokens ── */
      --duration-instant: 120ms;
      --duration-fast: 160ms;
      --duration-standard: 240ms;
      --duration-settle: 480ms;

      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-settle: cubic-bezier(0.25, 1, 0.35, 1.06);
      --ease-snappy: cubic-bezier(0.18, 0.89, 0.32, 1.28);

      color-scheme: light;
      --bg-page: #fbfbfb;
      --stage-bg: #f8f8f8;
      --stage-border: #eeeeee;

      --foreground: #0b0b0b;
      --background: #ffffff;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-muted: #f2f2f2;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text-muted: #888888;
      --text-secondary: #555555;
      --success: #10b981;

      --radius-control: 18px;
      --radius-card: 20px;
      --radius-surface: 34px;
      --radius-pill: 9999px;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-floating: 0 20px 48px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.03);

      --font-display: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #1a1a1a;
      --stage-bg: #242424;
      --stage-border: #2e2e2e;

      --foreground: #ffffff;
      --background: #191919;
      --surface: #1e1e1e;
      --surface-raised: #282828;
      --surface-muted: #2a2a2a;
      --border: #2e2e2e;
      --border-strong: #444444;
      --border-subtle: #252525;
      --text-muted: #919191;
      --text-secondary: #b5b5b5;
      --success: #34d399;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-floating: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-display);
      background-color: var(--bg-page);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.015em;
    }

    /* 顶部控制栏 */
    .arc-standalone-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 880px;
      height: 48px;
      background: color-mix(in oklab, var(--surface) 80%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    .bar-meta { display: flex; align-items: center; gap: 10px; }
    .bar-meta .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    .bar-meta .title { font-size: 13px; font-weight: 700; }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-resting);
      transition: transform 0.15s var(--ease-snappy);
    }
    .theme-toggle-btn:active { transform: scale(0.90); }

    /* 中央舞台 */
    .arc-stage {
      width: 100%;
      max-width: 880px;
      min-height: 420px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      border-radius: var(--radius-surface);
      box-shadow: var(--shadow-floating);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      margin-top: 40px;
      position: relative;
    }

    /* ── 官方 1:1 展示容器 (Card Showcase) ── */
    .copy-showcase-panel {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 模块 1：Share link 容器 */
    .share-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .share-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 4px 6px 4px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      box-shadow: var(--shadow-resting);
    }

    .share-url {
      font-size: 14px;
      color: var(--foreground);
      font-weight: 400;
      user-select: text;
    }

    /* ── 官方 CopyButton 样式 ── */
    .arc-copy-btn {
      position: relative;
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      height: 36px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 14px;
      background: var(--surface);
      color: var(--foreground);
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: background-color var(--duration-fast) var(--ease-standard),
                  border-color var(--duration-fast) var(--ease-standard),
                  color var(--duration-fast) var(--ease-standard),
                  transform var(--duration-instant) var(--ease-standard);
      will-change: transform;
    }

    @media (hover: hover) and (pointer: fine) {
      .arc-copy-btn:hover {
        background: var(--surface-muted);
        border-color: var(--border-strong);
      }
    }

    .arc-copy-btn:active {
      transform: scale(0.97);
    }

    /* 图标插槽 */
    .copy-icon-slot {
      position: relative;
      display: grid;
      width: 16px;
      height: 16px;
      flex: none;
      place-items: center;
    }

    .copy-icon-inner {
      grid-area: 1 / 1;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      will-change: transform, opacity, filter;
      transition: transform var(--duration-standard) var(--ease-enter),
                  opacity var(--duration-fast) var(--ease-enter),
                  filter var(--duration-fast) var(--ease-enter);
    }

    .icon-normal {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    .arc-copy-btn[data-state="copied"] .icon-normal {
      opacity: 0;
      transform: scale(0.6);
      filter: blur(2px);
    }

    .icon-check {
      opacity: 0;
      transform: scale(0.6);
      filter: blur(2px);
      color: var(--success);
    }

    .arc-copy-btn[data-state="copied"] .icon-check {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    .drawn-check-path {
      stroke: currentColor;
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      transition: stroke-dashoffset 0.34s var(--ease-enter) 0.05s;
    }

    .arc-copy-btn[data-state="copied"] .drawn-check-path {
      stroke-dashoffset: 0;
    }

    /* ── 官方 Grid 空间预留器 (.measure)，杜绝文字变形时的宽度抖动 ── */
    .label-measure-grid {
      display: grid;
      min-width: 0;
      text-align: left;
      white-space: nowrap;
    }

    .measure-ghost, .morph-text-layer {
      grid-area: 1 / 1;
    }

    .measure-ghost {
      visibility: hidden;
      pointer-events: none;
      user-select: none;
    }

    .morph-text-layer {
      position: relative;
      display: inline-flex;
      align-items: center;
      white-space: pre;
    }

    .c-glyph {
      display: inline-block;
      white-space: pre;
      transition: transform var(--duration-standard) var(--ease-enter),
                  opacity var(--duration-standard) var(--ease-enter),
                  filter var(--duration-standard) var(--ease-enter);
    }

    .c-glyph.in {
      opacity: 0;
      transform: translateY(5px);
      filter: blur(3px);
    }

    .c-glyph.rest {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0px);
    }

    .c-glyph.out {
      position: absolute;
      top: 0;
      opacity: 0 !important;
      transform: translateY(-4px) !important;
      filter: blur(2px) !important;
      pointer-events: none;
      transition: transform var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard),
                  filter var(--duration-fast) var(--ease-standard) !important;
    }

    /* 模块 2：Invite code 纯净行 */
    .invite-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .invite-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .invite-label {
      font-size: 13.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .invite-code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--foreground);
      letter-spacing: 0.02em;
    }

    /* Plain Icon-Only 按钮 */
    .arc-copy-btn.icon-only {
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }

    @media (hover: hover) and (pointer: fine) {
      .arc-copy-btn.icon-only:hover {
        background: var(--surface-muted);
        color: var(--foreground);
      }
    }

    .hint-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 36px;
      letter-spacing: -0.01em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  
    /* 嵌入宿主模式适配 */
    body.is-embedded {
      padding: 0 !important;
      background: transparent !important;
      min-height: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    body.is-embedded .arc-standalone-bar {
      display: none !important;
    }
    body.is-embedded .stage-card, 
    body.is-embedded .stage-box, 
    body.is-embedded .main-stage,
    body.is-embedded .container,
    body.is-embedded .wrapper {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
    }

  
    body.is-embedded .stage-toolbar,
    body.is-embedded .standalone-header { display: none !important; }
    body.is-embedded .arc-stage-card { border: none !important; box-shadow: none !important; background: transparent !important; margin: 0 !important; }


/* 宿主嵌入统一强力去重样式 */
body.is-embedded .stage-toolbar,
body.is-embedded .arc-standalone-bar,
body.is-embedded .standalone-header {
  display: none !important;
}
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-box,
body.is-embedded .main-stage {
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
  margin: 0 !important;
  min-height: auto !important;
  width: 100% !important;
}
body.is-embedded {
  padding: 0 !important;
  background: transparent !important;
  min-height: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}


/* 嵌入模式彻底消除滚动条与强制居中 */
html.is-embedded, body.is-embedded {
  overflow: hidden !important;
  height: 100% !important;
  min-height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
body.is-embedded::-webkit-scrollbar,
html.is-embedded::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
body.is-embedded .arc-stage,
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-content {
  margin: 0 !important;
  padding: 24px !important;
  min-height: auto !important;
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
}

</style>
</head>
<body>

  <!-- 顶部控制栏 -->
  <header class="arc-standalone-bar">
    <div class="bar-meta">
      <span class="badge">01_Buttons</span>
      <span class="title">Copy button (copy-button)</span>
    </div>
    <div class="bar-controls">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换暗黑/浅色模式 (快捷键: D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <!-- 主舞台 -->
  <main class="arc-stage">
    <div class="copy-showcase-panel">
      <!-- 官方上下文 1: Share link -->
      <div class="share-section">
        <label class="section-label">Share link</label>
        <div class="share-box">
          <span class="share-url" id="shareUrlText">example.com/launch</span>
          <button class="arc-copy-btn" id="copyLinkBtn" data-state="idle" type="button" aria-label="Copy link">
            <span class="copy-icon-slot">
              <span class="copy-icon-inner icon-normal">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
              </span>
              <span class="copy-icon-inner icon-check">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path class="drawn-check-path" d="M4 12l5 5L20 6"/>
                </svg>
              </span>
            </span>
            <span class="label-measure-grid" aria-hidden="true">
              <!-- 预留最大宽度: Copy link 与 Copied 均包含 -->
              <span class="measure-ghost">Copy link</span>
              <span class="measure-ghost">Copied</span>
              <span class="morph-text-layer" id="linkBtnTextLayer"></span>
            </span>
          </button>
        </div>
      </div>

      <!-- 官方上下文 2: Invite code -->
      <div class="invite-section">
        <div class="invite-left">
          <span class="invite-label">Invite code</span>
          <span class="invite-code" id="inviteCodeVal">ARC-4821</span>
        </div>
        <button class="arc-copy-btn icon-only" id="copyCodeBtn" data-state="idle" type="button" aria-label="Copy invite code" title="Copy code">
          <span class="copy-icon-slot">
            <span class="copy-icon-inner icon-normal">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
            </span>
            <span class="copy-icon-inner icon-check">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path class="drawn-check-path" d="M4 12l5 5L20 6"/>
              </svg>
            </span>
          </span>
        </button>
      </div>
    </div>

    <span class="hint-text">Copy a value with immediate confirmation and zero-wobble reserved label width</span>
  </main>

  <script>

      // 嵌入检测与主题同步
      const params = new URLSearchParams(window.location.search);
      const isEmbedded = window.self !== window.top || params.get('embed') === 'true';
      if (isEmbedded) {
        document.body.classList.add('is-embedded'); document.documentElement.classList.add('is-embedded');
      }
      const urlTheme = params.get('theme');
      if (urlTheme) {
        document.documentElement.dataset.theme = urlTheme;
      }
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'ARC_THEME_CHANGE' && e.data.theme) {
          document.documentElement.dataset.theme = e.data.theme;
        }
      });

    (function init() {
      // 1. 主题切换
      const root = document.documentElement;
      const themeBtn = document.getElementById('themeToggleBtn');
      function toggleTheme() {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('arc_theme', next); } catch (e) {}
      }
      themeBtn.addEventListener('click', toggleTheme);
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'd' || e.key === 'D') && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) toggleTheme();
      });

      // 2. 剪贴板安全写入
      async function copyToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) {}
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          document.body.removeChild(ta);
          return true;
        } catch (e) {
          document.body.removeChild(ta);
          return false;
        }
      }

      // 3. 逐字形态比对引擎 (MorphText with popLayout)
      const textLayer = document.getElementById('linkBtnTextLayer');

      function morphLabel(newText) {
        const currentSpans = Array.from(textLayer.children).filter(s => !s.classList.contains('out'));
        const oldText = currentSpans.map(s => s.textContent).join('');
        if (oldText === newText) return;

        let start = 0;
        while (start < oldText.length && start < newText.length && oldText[start] === newText[start]) start++;
        let end = 0;
        while (end < (oldText.length - start) && end < (newText.length - start) &&
               oldText[oldText.length - 1 - end] === newText[newText.length - 1 - end]) end++;

        // 退场字符脱离文档流
        const leaving = currentSpans.slice(start, oldText.length - end);
        leaving.forEach(s => {
          s.style.left = `${s.offsetLeft}px`;
          s.classList.remove('rest', 'in');
          s.classList.add('out');
        });

        // 进入字符
        const incomingChars = newText.slice(start, newText.length - end);
        const incoming = [];
        for (let i = 0; i < incomingChars.length; i++) {
          const span = document.createElement('span');
          span.className = 'c-glyph in';
          span.textContent = incomingChars[i];
          span.style.transitionDelay = `${Math.min(i * 18, 100)}ms`;
          incoming.push(span);
        }

        const anchor = currentSpans[oldText.length - end] || null;
        incoming.forEach(span => textLayer.insertBefore(span, anchor));

        requestAnimationFrame(() => {
          incoming.forEach(span => {
            span.classList.remove('in');
            span.classList.add('rest');
          });
        });

        setTimeout(() => leaving.forEach(s => s.remove()), 180);
      }

      function initLabel(str) {
        textLayer.innerHTML = '';
        for (let i = 0; i < str.length; i++) {
          const s = document.createElement('span');
          s.className = 'c-glyph rest';
          s.textContent = str[i];
          textLayer.appendChild(s);
        }
      }

      initLabel('Copy link');

      // 4. 按钮交互绑定
      const linkBtn = document.getElementById('copyLinkBtn');
      let linkTimer = null;

      linkBtn.addEventListener('click', async () => {
        if (linkBtn.dataset.state === 'copied') return;
        clearTimeout(linkTimer);

        await copyToClipboard('https://example.com/launch');
        linkBtn.dataset.state = 'copied';
        morphLabel('Copied');

        linkTimer = setTimeout(() => {
          linkBtn.dataset.state = 'idle';
          morphLabel('Copy link');
        }, 1900);
      });

      const codeBtn = document.getElementById('copyCodeBtn');
      let codeTimer = null;

      codeBtn.addEventListener('click', async () => {
        if (codeBtn.dataset.state === 'copied') return;
        clearTimeout(codeTimer);

        await copyToClipboard('ARC-4821');
        codeBtn.dataset.state = 'copied';

        codeTimer = setTimeout(() => {
          codeBtn.dataset.state = 'idle';
        }, 1900);
      });
    })();
  </script>
</body>
</html>
