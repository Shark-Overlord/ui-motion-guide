<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc UI · Split button (split-button)</title>
  <style>
    :root {
      /* ── Arc UI Motion Tokens ── */
      --duration-instant: 120ms;
      --duration-fast: 160ms;
      --duration-standard: 240ms;
      --duration-spring: 360ms;

      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.18, 0.89, 0.32, 1.28);
      --ease-morph: cubic-bezier(0.34, 1.25, 0.64, 1);

      color-scheme: light;
      --bg-page: #fbfbfb;
      --stage-bg: #ffffff;
      --stage-border: #eeeeee;

      --foreground: #0b0b0b;
      --background: #ffffff;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-muted: #f4f4f4;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text-muted: #888888;
      --text-secondary: #555555;

      --success: #10b981;
      --danger: #e03131;

      --radius-control: 18px;
      --radius-panel: 20px;
      --radius-surface: 24px;
      --radius-pill: 9999px;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-raised: 0 4px 14px rgba(0, 0, 0, 0.08);
      --shadow-floating: 0 16px 40px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);

      --font-display: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #141414;
      --stage-bg: #1a1a1a;
      --stage-border: #282828;

      --foreground: #f4f4f4;
      --background: #141414;
      --surface: #222222;
      --surface-raised: #282828;
      --surface-muted: #2a2a2a;
      --border: #303030;
      --border-strong: #444444;
      --border-subtle: #242424;
      --text-muted: #8e8e8e;
      --text-secondary: #aaaaaa;

      --success: #34d399;
      --danger: #f56a65;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-raised: 0 6px 18px rgba(0, 0, 0, 0.5);
      --shadow-floating: 0 20px 48px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-display);
      background-color: var(--bg-page);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.015em;
    }

    /* 顶部控制栏 */
    .arc-standalone-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 880px;
      height: 48px;
      background: color-mix(in oklab, var(--surface) 80%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    .bar-meta { display: flex; align-items: center; gap: 10px; }
    .bar-meta .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    .bar-meta .title { font-size: 13px; font-weight: 700; }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-resting);
      transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .theme-toggle-btn:active { transform: scale(0.90); }

    /* 中央舞台容器 (对齐 screenshots/01_Buttons/split-button.png) */
    .arc-stage-card {
      width: 100%;
      max-width: 880px;
      min-height: 480px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      border-radius: var(--radius-surface);
      box-shadow: var(--shadow-floating);
      display: flex;
      flex-direction: column;
      margin-top: 40px;
      position: relative;
      overflow: visible;
    }

    .stage-toolbar {
      height: 52px;
      border-bottom: 1px solid var(--stage-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--stage-bg);
      user-select: none;
      border-radius: var(--radius-surface) var(--radius-surface) 0 0;
    }

    .stage-tabs {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stage-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      padding: 16px 0;
      position: relative;
      border: none;
      background: transparent;
      outline: none;
    }
    .stage-tab.active {
      color: var(--foreground);
      font-weight: 600;
    }
    .stage-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--foreground);
      border-radius: 1px;
    }

    .stage-hint {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stage-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      position: relative;
    }

    /* ── Split Button 官方结构 (对齐 split-button.module.css) ── */
    .split-wrapper {
      position: relative;
      display: inline-flex;
    }

    .split-group {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--foreground);
      border-radius: var(--radius-control);
      background: var(--foreground);
      box-shadow: var(--shadow-resting);
      transition: transform var(--duration-spring) var(--ease-spring);
      user-select: none;
      position: relative;
      z-index: 10;
    }

    /* 胶囊整体按压缩放联动 */
    .split-group.main-pressed {
      transform: scale(0.97);
      transition-duration: var(--duration-instant);
      transition-timing-function: var(--ease-standard);
    }

    .split-primary, .split-trigger {
      border: 0;
      background: var(--foreground);
      color: var(--background);
      font: inherit;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color var(--duration-fast) var(--ease-standard),
                  color var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard);
    }

    .split-primary {
      position: relative;
      display: inline-grid;
      height: 40px;
      min-height: 40px;
      place-items: center;
      padding: 0 16px;
      border-radius: calc(var(--radius-control) - 1px) 0 0 calc(var(--radius-control) - 1px);
      font-size: 13.5px;
      font-weight: 500;
    }

    .split-primary:hover,
    .split-trigger:hover {
      background: color-mix(in oklab, var(--foreground) 88%, var(--background));
    }

    .split-primary-slot {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      transition: width 400ms cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .split-primary-content {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .split-main-icon {
      display: inline-grid;
      width: 16px;
      height: 16px;
      place-items: center;
      position: relative;
    }

    .split-main-icon svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.75;
      position: absolute;
      transition: opacity var(--duration-fast) var(--ease-standard),
                  transform var(--duration-spring) var(--ease-spring);
    }

    /* 逐字 MorphText 动效规范 */
    .split-glyphs {
      position: relative;
      display: inline-flex;
      flex: none;
      white-space: pre;
    }

    .split-glyph {
      display: inline-block;
      will-change: transform, opacity, filter;
      transition: transform var(--duration-standard) var(--ease-enter),
                  opacity var(--duration-standard) var(--ease-enter),
                  filter var(--duration-standard) var(--ease-enter);
    }

    .glyph-in {
      opacity: 0;
      transform: translateY(5px);
      filter: blur(2px);
    }

    .glyph-rest {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .glyph-out {
      opacity: 0;
      transform: translateY(-4px);
      filter: blur(1.5px);
    }

    /* 右侧 Trigger 分割按键 */
    .split-trigger {
      display: grid;
      width: 38px;
      min-height: 40px;
      place-items: center;
      border-left: 1px solid color-mix(in oklab, var(--background) 18%, var(--foreground));
      border-radius: 0 calc(var(--radius-control) - 1px) calc(var(--radius-control) - 1px) 0;
    }

    .split-chevron {
      transition: transform var(--duration-spring) var(--ease-spring);
    }

    .split-group[data-state="open"] .split-chevron {
      transform: rotate(180deg);
    }

    /* 下拉菜单 (Radix Dropdown 规范) */
    .split-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 60;
      min-width: 13rem;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
      background: var(--surface-raised);
      color: var(--foreground);
      box-shadow: var(--shadow-floating);
      transform-origin: top right;
      opacity: 0;
      transform: translateY(-5px) scale(0.97);
      pointer-events: none;
      filter: blur(2px);
      transition: opacity var(--duration-fast) var(--ease-enter),
                  transform var(--duration-spring) var(--ease-spring),
                  filter var(--duration-fast) var(--ease-enter);
    }

    .split-menu.is-open {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
      pointer-events: auto;
    }

    .split-menu.is-closing {
      opacity: 0;
      transform: translateY(-3px) scale(0.985);
      filter: blur(1px);
      pointer-events: none;
      transition: opacity 130ms var(--ease-standard),
                  transform 130ms var(--ease-standard);
    }

    .split-item {
      display: flex;
      width: 100%;
      min-height: 34px;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border: none;
      background: transparent;
      color: inherit;
      border-radius: calc(var(--radius-panel) - 6px);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      outline: none;
      transition: background-color 0.12s ease;
    }

    .split-item:hover {
      background: var(--surface-muted);
    }

    .split-item-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .split-item-icon svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.75;
    }

    .split-item.destructive {
      color: var(--danger);
    }
    .split-item.destructive:hover {
      background: color-mix(in oklab, var(--danger) 10%, var(--surface));
    }

    .hint-caption {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 32px;
      letter-spacing: -0.01em;
    }
  
    /* 嵌入宿主模式适配 */
    body.is-embedded {
      padding: 0 !important;
      background: transparent !important;
      min-height: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    body.is-embedded .arc-standalone-bar {
      display: none !important;
    }
    body.is-embedded .stage-card, 
    body.is-embedded .stage-box, 
    body.is-embedded .main-stage,
    body.is-embedded .container,
    body.is-embedded .wrapper {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
    }

  
/* 宿主嵌入统一强力去重样式 */
body.is-embedded .stage-toolbar,
body.is-embedded .arc-standalone-bar,
body.is-embedded .standalone-header {
  display: none !important;
}
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-box,
body.is-embedded .main-stage {
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
  margin: 0 !important;
  min-height: auto !important;
  width: 100% !important;
}
body.is-embedded {
  padding: 0 !important;
  background: transparent !important;
  min-height: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}


/* 嵌入模式彻底消除滚动条与强制居中 */
html.is-embedded, body.is-embedded {
  overflow: hidden !important;
  height: 100% !important;
  min-height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
body.is-embedded::-webkit-scrollbar,
html.is-embedded::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
body.is-embedded .arc-stage,
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-content {
  margin: 0 !important;
  padding: 24px !important;
  min-height: auto !important;
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
}

</style>
</head>
<body>

  <!-- 顶部控制条 -->
  <header class="arc-standalone-bar">
    <div class="bar-meta">
      <span class="badge">01_Buttons</span>
      <span class="title">Split button (split-button)</span>
    </div>
    <div class="bar-controls">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换暗黑/浅色模式 (快捷键: D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 中央舞台卡片 (100% 对齐 screenshots/01_Buttons/split-button.png) -->
  <main class="arc-stage-card">
    <div class="stage-toolbar">
      <div class="stage-tabs">
        <button class="stage-tab active" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <span>Preview</span>
        </button>
      </div>
      <span class="stage-hint">Live · keyboard ready</span>
    </div>

    <div class="stage-content">
      <div class="split-wrapper" id="splitWrapper">
        <!-- 官方 1:1 分裂按钮主体 -->
        <div class="split-group" id="splitGroup" data-state="closed">
          <!-- 主操作按键 (Publish) -->
          <button class="split-primary" id="splitPrimaryBtn" type="button" aria-label="Publish">
            <span class="split-primary-slot" id="splitPrimarySlot">
              <span class="split-primary-content" id="splitPrimaryContent">
                <span class="split-main-icon" id="splitMainIcon">
                  <!-- Send 初始图标 -->
                  <svg id="iconSend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="opacity:1; transform:scale(1);">
                    <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
                  </svg>
                  <!-- Check 完成图标 (绿色) -->
                  <svg id="iconCheck" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-linecap="round" stroke-linejoin="round" style="opacity:0; transform:scale(0.6);">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                  <!-- FileText 草稿图标 -->
                  <svg id="iconDraft" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="opacity:0; transform:scale(0.6);">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
                  </svg>
                  <!-- Trash 删除图标 -->
                  <svg id="iconTrash" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-linecap="round" stroke-linejoin="round" style="opacity:0; transform:scale(0.6);">
                    <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                  </svg>
                </span>
                <span class="split-glyphs" id="splitGlyphs"></span>
              </span>
            </span>
          </button>

          <!-- 右侧 Trigger 打开选项菜单 -->
          <button class="split-trigger" id="splitTriggerBtn" type="button" aria-label="Publish more actions" aria-expanded="false">
            <svg class="split-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
        </div>

        <!-- 下拉菜单 (对齐 uiarc.dev 官方 3 项动作) -->
        <div class="split-menu" id="splitMenu">
          <button class="split-item" id="itemPublishNotify" data-action="publish-notify" type="button">
            <span class="split-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
              </svg>
            </span>
            <span>Publish and notify</span>
          </button>
          <button class="split-item" id="itemSaveDraft" data-action="save-draft" type="button">
            <span class="split-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
            </span>
            <span>Save as draft</span>
          </button>
          <button class="split-item destructive" id="itemDeleteDraft" data-action="delete-draft" type="button">
            <span class="split-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
            </span>
            <span>Delete draft</span>
          </button>
        </div>
      </div>

      <span class="hint-caption">A primary action with a menu of nearby alternatives</span>
    </div>
  </main>

  <script>

      // 嵌入检测与主题同步
      const params = new URLSearchParams(window.location.search);
      const isEmbedded = window.self !== window.top || params.get('embed') === 'true';
      if (isEmbedded) {
        document.body.classList.add('is-embedded'); document.documentElement.classList.add('is-embedded');
      }
      const urlTheme = params.get('theme');
      if (urlTheme) {
        document.documentElement.dataset.theme = urlTheme;
      }
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'ARC_THEME_CHANGE' && e.data.theme) {
          document.documentElement.dataset.theme = e.data.theme;
        }
      });

    (function init() {
      // 1. 主题切换
      const root = document.documentElement;
      const themeBtn = document.getElementById('themeToggleBtn');
      function toggleTheme() {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('arc_theme', next); } catch (e) {}
      }
      themeBtn.addEventListener('click', toggleTheme);
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'd' || e.key === 'D') && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) toggleTheme();
      });

      // 2. DOM 缓存
      const group = document.getElementById('splitGroup');
      const primaryBtn = document.getElementById('splitPrimaryBtn');
      const triggerBtn = document.getElementById('splitTriggerBtn');
      const menu = document.getElementById('splitMenu');
      const primarySlot = document.getElementById('splitPrimarySlot');
      const glyphs = document.getElementById('splitGlyphs');

      const iconSend = document.getElementById('iconSend');
      const iconCheck = document.getElementById('iconCheck');
      const iconDraft = document.getElementById('iconDraft');
      const iconTrash = document.getElementById('iconTrash');

      let currentLabel = 'Publish';
      let resetTimer = null;

      // 3. 官方 MorphText 逐字流转与公共前后缀复用算法 (结合 popLayout 机制)
      function updateMorphText(newText) {
        const currentSpans = Array.from(glyphs.children).filter(s => !s.classList.contains('glyph-out'));
        const oldText = currentSpans.map(s => s.textContent).join('');
        if (oldText === newText) return;

        let start = 0;
        while (start < oldText.length && start < newText.length && oldText[start] === newText[start]) start++;
        let end = 0;
        while (end < (oldText.length - start) && end < (newText.length - start) &&
               oldText[oldText.length - 1 - end] === newText[newText.length - 1 - end]) end++;
        if (start < 2) start = 0;
        if (end < 2) end = 0;

        // 1. popLayout 契约：退出字符立即固定当前绝对坐标并脱离流排版，防止与新字符叠加强制拉伸容器
        const exitingSpans = currentSpans.slice(start, oldText.length - end);
        exitingSpans.forEach(span => {
          const left = span.offsetLeft;
          span.style.position = 'absolute';
          span.style.left = `${left}px`;
          span.classList.remove('glyph-rest', 'glyph-in');
          span.classList.add('glyph-out');
        });

        // 2. 插入新字符（按需排列，立即决定新的自然排版宽度）
        const incomingChars = newText.slice(start, newText.length - end);
        const incomingSpans = [];
        for (let i = 0; i < incomingChars.length; i++) {
          const span = document.createElement('span');
          span.className = 'split-glyph glyph-in';
          span.textContent = incomingChars[i];
          span.style.transitionDelay = `${Math.min(i * 16, 80)}ms`;
          incomingSpans.push(span);
        }

        const insertAnchor = currentSpans[oldText.length - end] || null;
        incomingSpans.forEach(span => glyphs.insertBefore(span, insertAnchor));

        requestAnimationFrame(() => {
          incomingSpans.forEach(span => {
            span.classList.remove('glyph-in');
            span.classList.add('glyph-rest');
          });
        });

        setTimeout(() => {
          exitingSpans.forEach(s => s.remove());
        }, 180);
      }

      function initLabel(str) {
        glyphs.innerHTML = '';
        for (let i = 0; i < str.length; i++) {
          const span = document.createElement('span');
          span.className = 'split-glyph glyph-rest';
          span.textContent = str[i];
          glyphs.appendChild(span);
        }
      }

      // 4. 官方 useMorphWidth 契约：ResizeObserver 实时捕获内容真实自然尺寸，弹簧自适应伸缩
      const contentObserver = new ResizeObserver(([entry]) => {
        if (!entry) return;
        const nextW = Math.ceil(entry.contentRect.width);
        if (nextW > 0) {
          primarySlot.style.width = `${nextW}px`;
        }
      });
      contentObserver.observe(document.getElementById('splitPrimaryContent'));

      initLabel('Publish');

      // 4. 图标形态平滑切换
      function showIcon(targetIcon) {
        [iconSend, iconCheck, iconDraft, iconTrash].forEach(icon => {
          if (icon === targetIcon) {
            icon.style.opacity = '1';
            icon.style.transform = 'scale(1)';
          } else {
            icon.style.opacity = '0';
            icon.style.transform = 'scale(0.6)';
          }
        });
      }

      // 5. 官方动作流转 (触发后反馈，并在 2.2 秒后自动回归初始态)
      function triggerAction(actionName) {
        if (resetTimer) clearTimeout(resetTimer);

        if (actionName === 'publish' || actionName === 'publish-notify') {
          updateMorphText('Published');
          showIcon(iconCheck);
        } else if (actionName === 'save-draft') {
          updateMorphText('Draft saved');
          showIcon(iconDraft);
        } else if (actionName === 'delete-draft') {
          updateMorphText('Draft deleted');
          showIcon(iconTrash);
        }

        // 官方 2.2 秒后自动回归初始 Publish 态
        resetTimer = setTimeout(() => {
          updateMorphText('Publish');
          showIcon(iconSend);
        }, 2200);
      }

      // 6. 胶囊按压缩放联动
      primaryBtn.addEventListener('mousedown', () => group.classList.add('main-pressed'));
      window.addEventListener('mouseup', () => group.classList.remove('main-pressed'));

      // 7. 菜单开闭控制
      function openMenu() {
        menu.classList.remove('is-closing');
        menu.classList.add('is-open');
        group.setAttribute('data-state', 'open');
        triggerBtn.setAttribute('aria-expanded', 'true');
      }

      function closeMenu() {
        if (!menu.classList.contains('is-open')) return;
        menu.classList.remove('is-open');
        menu.classList.add('is-closing');
        group.setAttribute('data-state', 'closed');
        triggerBtn.setAttribute('aria-expanded', 'false');
        setTimeout(() => {
          menu.classList.remove('is-closing');
        }, 130);
      }

      triggerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (menu.classList.contains('is-open')) closeMenu();
        else openMenu();
      });

      primaryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerAction('publish');
      });

      // 菜单项选择
      menu.querySelectorAll('.split-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = item.dataset.action;
          closeMenu();
          triggerAction(action);
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#splitWrapper')) closeMenu();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });
    })();
  </script>
</body>
</html>
