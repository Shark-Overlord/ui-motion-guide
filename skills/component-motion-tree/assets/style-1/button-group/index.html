<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc UI · Button group (button-group)</title>
  <style>
    :root {
      /* ── Arc UI Motion Tokens ── */
      --duration-instant: 120ms;
      --duration-fast: 160ms;
      --duration-standard: 240ms;
      --duration-spring: 320ms;
      --duration-morph: 380ms;

      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-snappy: cubic-bezier(0.18, 0.89, 0.32, 1.12);
      --ease-morph: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.18, 0.89, 0.32, 1.12);

      color-scheme: light;
      --bg-page: #fbfbfb;
      --stage-bg: #f8f8f8;
      --stage-border: #eeeeee;

      --foreground: #0b0b0b;
      --background: #ffffff;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-muted: #f2f2f2;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text-muted: #888888;
      --text-secondary: #555555;
      --danger: #e03131;
      --success: #10b981;

      --radius-control: 18px;
      --radius-panel: 20px;
      --radius-surface: 34px;
      --radius-pill: 9999px;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-raised: 0 4px 14px rgba(0, 0, 0, 0.08);
      --shadow-floating: 0 16px 40px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);

      --font-display: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #1a1a1a;
      --stage-bg: #242424;
      --stage-border: #2e2e2e;

      --foreground: #ffffff;
      --background: #191919;
      --surface: #1e1e1e;
      --surface-raised: #282828;
      --surface-muted: #2a2a2a;
      --border: #2e2e2e;
      --border-subtle: #252525;
      --text-muted: #919191;
      --text-secondary: #b5b5b5;
      --danger: #f56a65;
      --success: #34d399;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-raised: 0 6px 18px rgba(0, 0, 0, 0.5);
      --shadow-floating: 0 20px 48px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-display);
      background-color: var(--bg-page);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.015em;
    }

    /* 顶部控制栏 */
    .arc-standalone-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 880px;
      height: 48px;
      background: color-mix(in oklab, var(--surface) 80%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-raised);
      z-index: 100;
    }

    .bar-meta { display: flex; align-items: center; gap: 10px; }
    .bar-meta .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    .bar-meta .title { font-size: 13px; font-weight: 700; }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-resting);
      transition: transform 0.15s var(--ease-snappy);
    }
    .theme-toggle-btn:active { transform: scale(0.90); }

    /* 中央舞台 */
    .arc-stage {
      width: 100%;
      max-width: 880px;
      min-height: 460px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      border-radius: var(--radius-surface);
      box-shadow: var(--shadow-floating);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      margin-top: 40px;
      position: relative;
    }

    .btn-group-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ── Button Group 官方设计规范 (button-group.module.css 1:1) ── */
    .btn-group-wrapper {
      position: relative;
      display: inline-flex;
    }

    .btn-group {
      --bg-h: 36px;
      --bg-pad-x: 14px;
      --bg-inset: 3px;
      --bg-radius: var(--radius-control);
      --bg-divider: var(--border);
      --bg-divider-inset: 11px;
      --bg-highlight: var(--surface-muted);
      --bg-highlight-pressed: color-mix(in oklab, var(--surface-muted), var(--foreground) 10%);
      --bg-muted-ink: var(--text-secondary);

      position: relative;
      isolation: isolate;
      display: inline-flex;
      max-width: 100%;
      align-items: stretch;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      border: 1px solid var(--border);
      border-radius: var(--bg-radius);
      background: var(--surface);
      color: var(--foreground);
      box-shadow: var(--shadow-resting);
      user-select: none;
      vertical-align: middle;
    }
    .btn-group::-webkit-scrollbar { display: none; }

    /* Small 尺寸变体 (官方 Row 2 Zoom: 28px) */
    .btn-group.sm {
      --bg-h: 28px;
      --bg-pad-x: 10px;
      --bg-radius: calc(var(--radius-control) - 3px);
      --bg-divider-inset: 8px;
    }

    /* Solid 变体 (官方 Row 3: 深色主按钮组) */
    .btn-group.solid {
      --bg-divider: color-mix(in oklab, var(--background) 20%, var(--foreground));
      --bg-highlight: color-mix(in oklab, var(--background) 13%, var(--foreground));
      --bg-highlight-pressed: color-mix(in oklab, var(--background) 22%, var(--foreground));
      --bg-muted-ink: color-mix(in oklab, var(--background) 72%, var(--foreground));
      border-color: var(--foreground);
      background: var(--foreground);
      color: var(--background);
    }
    .btn-group.solid .group-item {
      color: var(--background);
    }

    /* ── 单共享物理滑动高亮 (The travelling highlight) ── */
    .group-highlight {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--duration-fast) var(--ease-standard);
      will-change: transform, width, opacity;
    }
    .group-highlight::before {
      position: absolute;
      inset: var(--bg-inset);
      border-radius: calc(var(--bg-radius) - var(--bg-inset) - 1px);
      background: var(--bg-highlight);
      content: "";
      transition: background-color var(--duration-fast) var(--ease-standard);
    }
    .group-highlight[data-pressed]::before {
      background: var(--bg-highlight-pressed);
      transition-duration: var(--duration-instant);
    }
    /* 处于托盘内部连续滑动状态时开启物理 morph */
    .group-highlight.is-moving {
      transition: transform var(--duration-morph) var(--ease-morph),
                  width var(--duration-morph) var(--ease-morph),
                  opacity var(--duration-fast) var(--ease-standard);
    }
    .group-highlight.active {
      opacity: 1;
    }

    /* ── 按钮段 (Segment) ── */
    .group-item {
      position: relative;
      z-index: 1;
      display: inline-flex;
      flex: none;
      min-width: calc(var(--bg-h) - 2px);
      height: calc(var(--bg-h) - 2px);
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0 var(--bg-pad-x);
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: color var(--duration-fast) var(--ease-standard);
    }
    .btn-group.sm .group-item {
      font-size: 12px;
    }

    /* 纯图标段与触发器 */
    .group-item.icon-only {
      width: calc(var(--bg-h) - 2px);
      padding: 0;
    }
    .group-item.trigger {
      width: calc(var(--bg-h) - 6px);
      min-width: 0;
      padding: 0;
      color: var(--bg-muted-ink);
      transition: color var(--duration-fast) var(--ease-standard);
    }
    .group-item.trigger[data-state="open"] {
      color: inherit;
    }

    /* ── 发丝分割线 (官方规范: 伪元素自适应 + data-quiet 避让) ── */
    .group-item + .group-item::before {
      position: absolute;
      top: var(--bg-divider-inset);
      bottom: var(--bg-divider-inset);
      left: -0.5px;
      width: 1px;
      background: var(--bg-divider);
      content: "";
      pointer-events: none;
      transition: opacity var(--duration-fast) var(--ease-standard);
    }
    /* 邻近高亮时分割线优雅退让隐藏 */
    .group-item[data-quiet]::before {
      opacity: 0;
    }

    /* ── 按压响应：仅内容层缩放，外部容器与分割线保持不动 ── */
    .content {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform var(--duration-spring) var(--ease-spring),
                  opacity var(--duration-fast) var(--ease-standard);
    }
    .btn-group.sm .content {
      gap: 5px;
    }
    .group-item:active:not([aria-disabled="true"]) .content {
      transform: scale(0.97);
      transition-duration: var(--duration-instant);
      transition-timing-function: var(--ease-standard);
    }
    .group-item.icon-only:active:not([aria-disabled="true"]) .content {
      transform: scale(0.9);
    }
    .group-item.trigger:active .content {
      transform: none;
    }

    /* ── 图标与下拉 Chevron ── */
    .group-icon {
      width: 15px;
      height: 15px;
      stroke-width: 1.85;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-group.sm .group-icon {
      width: 14px;
      height: 14px;
    }

    .chevron {
      width: 16px;
      height: 16px;
      stroke-width: 1.75;
      transition: transform var(--duration-spring) var(--ease-spring);
    }
    .group-item.trigger[data-state="open"] .chevron {
      transform: rotate(180deg);
    }

    /* ── 原位形态插槽 (Slot & Sizers) ── */
    .slot {
      position: relative;
      display: inline-flex;
      min-width: 0;
      align-items: center;
      justify-content: center;
    }
    .slot-content {
      display: inline-grid;
      flex: none;
      align-items: center;
      justify-items: center;
    }
    .slot-content > * {
      grid-area: 1 / 1;
    }
    .phase {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: opacity var(--duration-fast) var(--ease-enter),
                  filter var(--duration-fast) var(--ease-enter);
    }
    .sizer {
      visibility: hidden;
      pointer-events: none;
      user-select: none;
    }
    .group-item:disabled,
    .group-item[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.45;
    }
    .group-item:disabled .content,
    .group-item[aria-disabled="true"] .content {
      opacity: 0.45;
    }

    /* ── 官方 Zoom 视口控制与 Animated Counter 滚轮跳动系统 ── */
    .zoom-value {
      display: inline-grid;
      place-items: center;
      padding-inline: 2px;
      font-variant-numeric: tabular-nums;
      position: relative;
    }
    .zoom-value > * {
      grid-area: 1 / 1;
    }
    .zoom-sizer {
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      padding-inline: 1px;
      font-weight: 500;
      font-size: 12px;
    }
    .zoom-value > span {
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      font-weight: 500;
      letter-spacing: inherit;
      line-height: 1;
    }

    .animated-counter {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      color: inherit;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .counter-value {
      display: inline-flex;
      align-items: flex-start;
      white-space: nowrap;
      user-select: none;
    }
    .counter-column {
      --feather: .16em;
      position: relative;
      display: inline-block;
      overflow: hidden;
      margin-block: calc(var(--feather) * -1);
      padding-block: var(--feather);
      mask-image: linear-gradient(to bottom, transparent, #000 calc(var(--feather) * 1.5), #000 calc(100% - var(--feather) * 1.5), transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 calc(var(--feather) * 1.5), #000 calc(100% - var(--feather) * 1.5), transparent);
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }
    .counter-sizer {
      visibility: hidden;
      user-select: none;
    }
    .counter-glyph {
      position: absolute;
      inset: var(--feather) 0;
      text-align: center;
      user-select: none;
      will-change: transform, opacity, filter;
      line-height: 1;
    }
    .counter-symbol {
      display: inline-block;
      overflow-x: clip;
      line-height: 1;
    }
    .counter-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* ── 下拉浮动菜单 (官方 Radix 样式 1:1) ── */
    .group-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 60;
      min-width: 13rem;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
      background: var(--surface-raised);
      color: var(--foreground);
      box-shadow: var(--shadow-floating);
      transform-origin: top right;
      opacity: 0;
      transform: translateY(-5px) scale(0.97);
      pointer-events: none;
      filter: blur(2px);
      transition: opacity var(--duration-fast) var(--ease-enter),
                  transform var(--duration-spring) var(--ease-snappy),
                  filter var(--duration-fast) var(--ease-enter);
    }
    .group-menu.is-open {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
      pointer-events: auto;
    }

    .menu-item {
      display: flex;
      min-height: 36px;
      align-items: center;
      gap: 10px;
      padding: 0 11px;
      border-radius: calc(var(--radius-panel) - 6px);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      border: none;
      width: 100%;
      background: transparent;
      color: inherit;
      text-align: left;
      transition: background-color 0.12s ease;
    }
    .menu-item:hover, .menu-item:focus {
      background: var(--surface-muted);
    }
    .menu-item.destructive {
      color: var(--danger);
    }
    .menu-item.destructive:hover {
      background: color-mix(in oklab, var(--danger) 8%, var(--surface));
    }

    .hint-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 32px;
      letter-spacing: -0.01em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  
    /* 嵌入宿主模式适配 */
    body.is-embedded {
      padding: 0 !important;
      background: transparent !important;
      min-height: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    body.is-embedded .arc-standalone-bar {
      display: none !important;
    }
    body.is-embedded .stage-card, 
    body.is-embedded .stage-box, 
    body.is-embedded .main-stage,
    body.is-embedded .container,
    body.is-embedded .wrapper {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
    }

  
    body.is-embedded .stage-toolbar,
    body.is-embedded .standalone-header { display: none !important; }
    body.is-embedded .arc-stage-card { border: none !important; box-shadow: none !important; background: transparent !important; margin: 0 !important; }


/* 宿主嵌入统一强力去重样式 */
body.is-embedded .stage-toolbar,
body.is-embedded .arc-standalone-bar,
body.is-embedded .standalone-header {
  display: none !important;
}
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-box,
body.is-embedded .main-stage {
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
  margin: 0 !important;
  min-height: auto !important;
  width: 100% !important;
}
body.is-embedded {
  padding: 0 !important;
  background: transparent !important;
  min-height: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}


/* 嵌入模式彻底消除滚动条与强制居中 */
html.is-embedded, body.is-embedded {
  overflow: hidden !important;
  height: 100% !important;
  min-height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
body.is-embedded::-webkit-scrollbar,
html.is-embedded::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
body.is-embedded .arc-stage,
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-content {
  margin: 0 !important;
  padding: 24px !important;
  min-height: auto !important;
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
}

</style>
</head>
<body>

  <!-- 顶部控制栏 -->
  <header class="arc-standalone-bar">
    <div class="bar-meta">
      <span class="badge">01_Buttons</span>
      <span class="title">Button group (button-group)</span>
    </div>
    <div class="bar-controls">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换暗黑/浅色模式 (快捷键: D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <!-- 主舞台：官方三行组合矩阵 (100% 像素级对齐) -->
  <main class="arc-stage">
    <div class="btn-group-showcase">
      <!-- ── 1. 顶部主要操作组 (Share | Duplicate | Archive | Chevron) · md ── -->
      <div class="btn-group-wrapper">
        <div role="group" aria-label="Document actions" class="btn-group md" id="mainGroup">
          <div class="group-highlight"></div>

          <!-- Share (带 Copied 原位预留宽度) -->
          <button class="group-item" id="btnShare" data-key="share" type="button" aria-label="Share">
            <span class="content">
              <span class="slot">
                <span class="slot-content">
                  <span class="phase sizer"><span class="group-icon"></span><span>Share</span></span>
                  <span class="phase sizer"><span class="group-icon"></span><span>Copied</span></span>
                  <span class="phase" id="sharePhase">
                    <svg class="group-icon" id="shareIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <span id="shareLabel">Share</span>
                  </span>
                </span>
              </span>
            </span>
          </button>

          <!-- Duplicate -->
          <button class="group-item" id="btnDuplicate" data-key="duplicate" type="button" aria-label="Duplicate">
            <span class="content">
              <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              <span>Duplicate</span>
            </span>
          </button>

          <!-- Archive -->
          <button class="group-item" id="btnArchive" data-key="archive" type="button" aria-label="Archive">
            <span class="content">
              <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="5" x="2" y="3" rx="1"/>
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
                <path d="M10 12h4"/>
              </svg>
              <span>Archive</span>
            </span>
          </button>

          <!-- Menu Trigger -->
          <button class="group-item trigger" id="btnMenuTrigger" data-key="button-group-menu" type="button" aria-label="More actions" title="More actions" aria-haspopup="true" aria-expanded="false">
            <span class="content">
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
          </button>
        </div>

        <!-- 挂载的下拉菜单 (Align to edge) -->
        <div class="group-menu" id="dropdownMenu" role="menu">
          <button class="menu-item" type="button" role="menuitem">
            <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
              <path d="m15 5 4 4"/>
            </svg>
            <span>Rename project</span>
          </button>
          <button class="menu-item" type="button" role="menuitem">
            <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
              <polyline points="16 6 12 2 8 6"/>
              <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            <span>Export archive</span>
          </button>
          <button class="menu-item destructive" type="button" role="menuitem">
            <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
            <span>Delete permanently</span>
          </button>
        </div>
      </div>

      <!-- ── 2. 中间缩放控制步进组 (- | 100% | +) · sm (官方 28px) ── -->
      <div role="group" aria-label="Zoom" class="btn-group sm" id="zoomGroup">
        <div class="group-highlight"></div>

        <button class="group-item icon-only" id="btnZoomOut" data-key="out" type="button" aria-label="Zoom out" title="Zoom out">
          <span class="content">
            <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </span>
        </button>

        <!-- 官方 Reset 项: 点击一键恢复 100% (集成 Animated Counter 与 400% Sizer) -->
        <button class="group-item" id="btnZoomReset" data-key="reset" type="button" aria-label="Zoom 100%, reset to 100%" title="Reset zoom">
          <span class="content">
            <span class="slot">
              <span class="slot-content">
                <span class="phase">
                  <span class="zoom-value">
                    <span class="zoom-sizer" aria-hidden="true">400%</span>
                    <span class="animated-counter" id="zoomAnimatedCounter">
                      <span class="counter-sr-only" id="zoomSrOnly">100%</span>
                      <span class="counter-value" id="zoomCounterValue" aria-hidden="true"></span>
                    </span>
                  </span>
                </span>
              </span>
            </span>
          </span>
        </button>

        <button class="group-item icon-only" id="btnZoomIn" data-key="in" type="button" aria-label="Zoom in" title="Zoom in">
          <span class="content">
            <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </span>
        </button>
      </div>

      <!-- ── 3. 底部 Solid 暗黑主动作组 (Save | Preview) · md (官方 36px) ── -->
      <div role="group" aria-label="Editor actions" class="btn-group solid md" id="solidGroup">
        <div class="group-highlight"></div>

        <!-- Save (带 Saved! 原位预留宽度) -->
        <button class="group-item" id="btnSave" data-key="save" type="button" aria-label="Save">
          <span class="content">
            <span class="slot">
              <span class="slot-content">
                <span class="phase sizer"><span class="group-icon"></span><span>Save</span></span>
                <span class="phase sizer"><span class="group-icon"></span><span>Saved!</span></span>
                <span class="phase" id="savePhase">
                  <svg class="group-icon" id="saveIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                  </svg>
                  <span id="saveLabel">Save</span>
                </span>
              </span>
            </span>
          </span>
        </button>

        <!-- Preview -->
        <button class="group-item" id="btnPreview" data-key="preview" type="button" aria-label="Preview">
          <span class="content">
            <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Preview</span>
          </span>
        </button>
      </div>
    </div>

    <span class="hint-text">Related actions joined into one surface with hairline dividers and a gliding highlight</span>
  </main>

  <script>

      // 嵌入检测与主题同步
      const params = new URLSearchParams(window.location.search);
      const isEmbedded = window.self !== window.top || params.get('embed') === 'true';
      if (isEmbedded) {
        document.body.classList.add('is-embedded'); document.documentElement.classList.add('is-embedded');
      }
      const urlTheme = params.get('theme');
      if (urlTheme) {
        document.documentElement.dataset.theme = urlTheme;
      }
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'ARC_THEME_CHANGE' && e.data.theme) {
          document.documentElement.dataset.theme = e.data.theme;
        }
      });

    (function init() {
      // 1. 主题切换
      const root = document.documentElement;
      const themeBtn = document.getElementById('themeToggleBtn');
      function toggleTheme() {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('arc_theme', next); } catch (e) {}
      }
      themeBtn.addEventListener('click', toggleTheme);
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'd' || e.key === 'D') && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) toggleTheme();
      });

      // 2. 下拉菜单控制器与高亮锁定
      const mainGroup = document.getElementById('mainGroup');
      const menuTrigger = document.getElementById('btnMenuTrigger');
      const dropdownMenu = document.getElementById('dropdownMenu');
      let isMenuOpen = false;

      // 3. 官方物理高亮状态机与发丝线自适应退让 (Gliding Highlight Engine)
      const groups = document.querySelectorAll('.btn-group');

      groups.forEach(group => {
        const highlight = group.querySelector('.group-highlight');
        const items = Array.from(group.querySelectorAll('.group-item'));
        const isMain = group === mainGroup;

        let activeItem = null;
        let isVisible = false;
        let isPressing = false;

        function updateQuietDividers(activeIdx) {
          items.forEach((it, idx) => {
            if (activeIdx >= 0 && (idx === activeIdx || idx === activeIdx + 1)) {
              it.setAttribute('data-quiet', '');
            } else {
              it.removeAttribute('data-quiet');
            }
          });
        }

        function measure(node) {
          const gRect = group.getBoundingClientRect();
          const nRect = node.getBoundingClientRect();
          return {
            left: Math.round(nRect.left - gRect.left),
            width: Math.round(nRect.width)
          };
        }

        function placeHighlight(item, mode) {
          if (!item || item.disabled || item.getAttribute('aria-disabled') === 'true') {
            fadeLeave();
            return;
          }

          const { left, width } = measure(item);
          activeItem = item;
          const activeIdx = items.indexOf(item);
          updateQuietDividers(activeIdx);

          if (!isVisible || mode === 'jump') {
            // 首次移入：Jump 定位原地淡入，杜绝从 (0,0) 飞掠
            highlight.className = 'group-highlight';
            highlight.style.transform = `translateX(${left}px)`;
            highlight.style.width = `${width}px`;
            highlight.style.opacity = '0';
            void highlight.offsetHeight; // reflow
            highlight.classList.add('active');
            highlight.style.opacity = '1';
            isVisible = true;
          } else {
            // 组内连续滑动：平滑 morph 漂移
            highlight.className = 'group-highlight is-moving active';
            highlight.style.transform = `translateX(${left}px)`;
            highlight.style.width = `${width}px`;
            highlight.style.opacity = '1';
          }

          if (isPressing) {
            highlight.setAttribute('data-pressed', '');
          } else {
            highlight.removeAttribute('data-pressed');
          }
        }

        function fadeLeave() {
          // 如果主组的菜单正处于打开状态，高亮强制锁定在 Chevron 上，不熄灭！
          if (isMain && isMenuOpen) {
            placeHighlight(menuTrigger, 'move');
            return;
          }
          if (!isVisible) return;
          isVisible = false;
          activeItem = null;
          isPressing = false;
          highlight.classList.remove('active', 'is-moving');
          highlight.removeAttribute('data-pressed');
          highlight.style.opacity = '0';
          updateQuietDividers(-1);
        }

        items.forEach(item => {
          item.addEventListener('mouseenter', () => {
            if (item.disabled || item.getAttribute('aria-disabled') === 'true') {
              fadeLeave();
              return;
            }
            placeHighlight(item, 'move');
          });

          item.addEventListener('focus', () => {
            if (item.disabled || item.getAttribute('aria-disabled') === 'true') {
              fadeLeave();
              return;
            }
            placeHighlight(item, 'move');
          });

          item.addEventListener('pointerdown', (e) => {
            if (e.button === 0) {
              isPressing = true;
              highlight.setAttribute('data-pressed', '');
            }
          });

          item.addEventListener('pointerup', () => {
            isPressing = false;
            highlight.removeAttribute('data-pressed');
          });

          item.addEventListener('pointercancel', () => {
            isPressing = false;
            highlight.removeAttribute('data-pressed');
          });
        });

        group.addEventListener('mouseleave', () => {
          fadeLeave();
        });

        group.addEventListener('focusout', (e) => {
          if (!group.contains(e.relatedTarget)) {
            fadeLeave();
          }
        });

        // 对外挂载给菜单控制
        group._placeHighlight = placeHighlight;
        group._fadeLeave = fadeLeave;
      });

      // 4. 下拉菜单打开/关闭流转与高亮常驻联动
      function openMenu() {
        isMenuOpen = true;
        menuTrigger.setAttribute('data-state', 'open');
        menuTrigger.setAttribute('aria-expanded', 'true');
        dropdownMenu.classList.add('is-open');
        mainGroup._placeHighlight(menuTrigger, 'jump');
      }

      function closeMenu() {
        isMenuOpen = false;
        menuTrigger.setAttribute('data-state', 'closed');
        menuTrigger.setAttribute('aria-expanded', 'false');
        dropdownMenu.classList.remove('is-open');
        mainGroup._fadeLeave();
      }

      menuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isMenuOpen) closeMenu();
        else openMenu();
      });

      document.addEventListener('click', (e) => {
        if (isMenuOpen && !dropdownMenu.contains(e.target) && !menuTrigger.contains(e.target)) {
          closeMenu();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isMenuOpen) closeMenu();
      });

      // 5. Share 按钮原位形态转换应答 (Share -> Copied 1:1)
      const btnShare = document.getElementById('btnShare');
      const shareLabel = document.getElementById('shareLabel');
      const shareIcon = document.getElementById('shareIcon');
      let shareTimer = null;

      btnShare.addEventListener('click', () => {
        clearTimeout(shareTimer);
        shareLabel.textContent = 'Copied';
        btnShare.style.color = 'var(--success)';
        shareIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';

        shareTimer = setTimeout(() => {
          shareLabel.textContent = 'Share';
          btnShare.style.color = '';
          shareIcon.innerHTML = '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>';
        }, 1600);
      });

      // 6. 官方 1:1 Animated Counter 滚轮跳动系统与 Zoom 步进联动
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      class DigitColumn {
        constructor(digit) {
          this.currentDigit = digit;
          this.startPos = digit;
          this.targetPos = digit;
          this.position = digit;
          this.startTime = 0;
          this.duration = 400; // 400ms 对标官方 smooth spring (visualDuration: 0.4s)
          this.animating = false;

          this.dom = document.createElement('span');
          this.dom.className = 'counter-column';
          
          const sizer = document.createElement('span');
          sizer.className = 'counter-sizer';
          sizer.textContent = '0';
          this.dom.appendChild(sizer);
          
          this.glyphs = [];
          for (let i = 0; i <= 9; i++) {
            const g = document.createElement('span');
            g.className = 'counter-glyph';
            g.textContent = String(i);
            this.dom.appendChild(g);
            this.glyphs.push(g);
          }
          this.renderAt(this.position);
        }

        setTarget(digit, direction, delay = 0) {
          if (digit === this.currentDigit && !this.animating) return;
          this.startPos = this.position;
          if (direction > 0) {
            const delta = (digit - (Math.round(this.position) % 10) + 10) % 10;
            this.targetPos = this.position + (delta === 0 && digit !== this.currentDigit ? 10 : delta);
          } else {
            const delta = ((Math.round(this.position) % 10) - digit + 10) % 10;
            this.targetPos = this.position - (delta === 0 && digit !== this.currentDigit ? 10 : delta);
          }
          this.currentDigit = digit;
          this.startTime = performance.now() + delay;
          this.animating = true;
        }

        update(now) {
          if (!this.animating) return false;
          if (now < this.startTime) return true; // 错峰等待中
          const elapsed = now - this.startTime;
          const progress = Math.min(elapsed / this.duration, 1);
          const eased = easeOutCubic(progress);
          this.position = this.startPos + (this.targetPos - this.startPos) * eased;
          this.renderAt(this.position);
          if (progress >= 1) {
            this.position = this.targetPos;
            this.renderAt(this.position);
            this.animating = false;
            return false;
          }
          return true;
        }

        renderAt(pos) {
          for (let i = 0; i <= 9; i++) {
            // 官方数学偏移公式: ((((i - pos) % 10) + 15) % 10) - 5
            const offset = ((((i - pos) % 10) + 15) % 10) - 5;
            const abs = Math.abs(offset);
            const g = this.glyphs[i];
            if (abs >= 1.05) {
              g.style.visibility = 'hidden';
              g.style.opacity = '0';
            } else {
              g.style.visibility = 'visible';
              g.style.transform = `translateY(${offset.toFixed(3)}em)`;
              g.style.opacity = Math.max(0, 1 - abs).toFixed(3);
              if (abs < 0.02) {
                g.style.filter = 'none';
              } else {
                g.style.filter = `blur(${(abs * 2.5).toFixed(2)}px)`;
              }
            }
          }
        }
      }

      class AnimatedCounter {
        constructor(container, initialValue = 100, suffix = '%') {
          this.container = container;
          this.suffix = suffix;
          this.value = initialValue;
          this.columns = [];
          this.running = false;

          this.symbol = document.createElement('span');
          this.symbol.className = 'counter-symbol';
          this.symbol.textContent = suffix;

          this.init(initialValue);
        }

        init(num) {
          this.container.innerHTML = '';
          this.columns = [];
          const digits = String(num).split('').map(Number);
          digits.forEach(d => {
            const col = new DigitColumn(d);
            this.columns.push(col);
            this.container.appendChild(col.dom);
          });
          this.container.appendChild(this.symbol);
        }

        setValue(nextNum, forceDirection = 0) {
          if (nextNum === this.value) return;
          const direction = forceDirection !== 0 ? forceDirection : (nextNum > this.value ? 1 : -1);
          this.value = nextNum;
          const nextDigits = String(nextNum).split('').map(Number);

          // 位数增减平滑展开与收缩
          while (this.columns.length < nextDigits.length) {
            const col = new DigitColumn(nextDigits[0]);
            col.dom.style.width = '0px';
            col.dom.style.opacity = '0';
            this.columns.unshift(col);
            this.container.insertBefore(col.dom, this.columns[1] ? this.columns[1].dom : this.symbol);
            requestAnimationFrame(() => {
              col.dom.style.width = 'auto';
              col.dom.style.opacity = '1';
            });
          }
          while (this.columns.length > nextDigits.length) {
            const col = this.columns.shift();
            col.dom.style.width = '0px';
            col.dom.style.opacity = '0';
            setTimeout(() => col.dom.remove(), 350);
          }

          // 官方 item stagger: 25ms 错峰延迟
          const len = nextDigits.length;
          for (let i = 0; i < len; i++) {
            const colIdx = direction > 0 ? (len - 1 - i) : i;
            const delay = i * 25;
            this.columns[colIdx].setTarget(nextDigits[colIdx], direction, delay);
          }

          this.startLoop();
        }

        startLoop() {
          if (this.running) return;
          this.running = true;
          const tick = () => {
            const now = performance.now();
            let anyActive = false;
            for (const col of this.columns) {
              if (col.update(now)) anyActive = true;
            }
            if (anyActive) {
              requestAnimationFrame(tick);
            } else {
              this.running = false;
            }
          };
          requestAnimationFrame(tick);
        }
      }

      // 缩放步进器联动 (官方实测真实梯级: [25, 50, 75, 100, 125, 150, 200, 300, 400])
      const zoomSteps = [25, 50, 75, 100, 125, 150, 200, 300, 400];
      let currentZoomIdx = 3; // 默认 100% (下标 3)
      const zoomCounterContainer = document.getElementById('zoomCounterValue');
      const zoomSrOnly = document.getElementById('zoomSrOnly');
      const btnZoomOut = document.getElementById('btnZoomOut');
      const btnZoomIn = document.getElementById('btnZoomIn');
      const btnZoomReset = document.getElementById('btnZoomReset');
      const zoomGroup = document.getElementById('zoomGroup');

      const animatedCounter = new AnimatedCounter(zoomCounterContainer, 100, '%');

      function updateZoomState(direction = 0) {
        const val = zoomSteps[currentZoomIdx];
        animatedCounter.setValue(val, direction);
        zoomSrOnly.textContent = `${val}%`;
        btnZoomReset.setAttribute('aria-label', `Zoom ${val}%, reset to 100%`);

        // 极值禁用与无障碍状态
        if (currentZoomIdx <= 0) {
          btnZoomOut.disabled = true;
          btnZoomOut.setAttribute('aria-disabled', 'true');
        } else {
          btnZoomOut.disabled = false;
          btnZoomOut.removeAttribute('aria-disabled');
        }

        if (currentZoomIdx >= zoomSteps.length - 1) {
          btnZoomIn.disabled = true;
          btnZoomIn.setAttribute('aria-disabled', 'true');
        } else {
          btnZoomIn.disabled = false;
          btnZoomIn.removeAttribute('aria-disabled');
        }
      }

      // 初始化极值状态
      updateZoomState(0);

      btnZoomOut.addEventListener('click', () => {
        if (currentZoomIdx > 0) {
          currentZoomIdx--;
          updateZoomState(-1);
        }
      });

      btnZoomIn.addEventListener('click', () => {
        if (currentZoomIdx < zoomSteps.length - 1) {
          currentZoomIdx++;
          updateZoomState(1);
        }
      });

      btnZoomReset.addEventListener('click', () => {
        if (currentZoomIdx === 3) return; // 已经是 100%
        const dir = 3 > currentZoomIdx ? 1 : -1;
        currentZoomIdx = 3;
        updateZoomState(dir);
      });

      // 7. Save 按钮原位反馈 (Save -> Saved! 1:1)
      const btnSave = document.getElementById('btnSave');
      const saveLabel = document.getElementById('saveLabel');
      const saveIcon = document.getElementById('saveIcon');
      let saveTimer = null;

      btnSave.addEventListener('click', () => {
        clearTimeout(saveTimer);
        saveLabel.textContent = 'Saved!';
        saveIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';

        saveTimer = setTimeout(() => {
          saveLabel.textContent = 'Save';
          saveIcon.innerHTML = '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>';
        }, 1600);
      });
    })();
  </script>
</body>
