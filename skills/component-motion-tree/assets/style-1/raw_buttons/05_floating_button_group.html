<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Raw Floating Button Group (浅色静态毛坯)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8f9fa;
      color: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    /* 纯白轻量浮动工具栏：无滑动高光底块、无 Tooltip 动量吸附、无 JS */
    .raw-floating-bar {
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
      padding: 4px;
      gap: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
    }
    .raw-tool-btn {
      border: none;
      background: transparent;
      color: #71717a;
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .raw-tool-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }
    .raw-tool-btn.text-btn {
      width: auto;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="raw-floating-bar">
    <button class="raw-tool-btn" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
    </button>
    <button class="raw-tool-btn" title="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 5.5 5.5 0 0 0 9.5 20H13"/></svg>
    </button>
    <button class="raw-tool-btn text-btn">Share</button>
    <button class="raw-tool-btn text-btn">Present</button>
  </div>
</body>
</html>
