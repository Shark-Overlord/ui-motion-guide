<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Raw Confirm Morph (浅色静态毛坯)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8f9fa;
      color: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    /* 浅色静态删除按钮：无原地横向展开、无倒计时进度条、无 Undo 撤销、无 JS */
    .raw-delete-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 16px;
      border-radius: 9999px;
      border: 1px solid rgba(239, 68, 68, 0.25);
      background: #ffffff;
      color: #dc2626;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(239, 68, 68, 0.08);
    }
    .raw-delete-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <button class="raw-delete-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
    </svg>
    <span>Delete item</span>
  </button>
</body>
</html>
