<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Raw Copy Button (浅色静态毛坯)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8f9fa;
      color: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    /* 纯白轻量复制按钮：无 3D 翻转、无微模糊文本置换、无自动复原、无 JS */
    .raw-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 14px;
      border-radius: 9999px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #ffffff;
      color: #18181b;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .raw-copy-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <button class="raw-copy-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
    </svg>
    <span>Copy Code</span>
  </button>
</body>
</html>
