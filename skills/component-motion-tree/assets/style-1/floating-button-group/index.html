<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc UI · Floating button group (floating-button-group)</title>
  <style>
    :root {
      /* ── Arc UI & transitions.dev Motion Tokens ── */
      --duration-instant: 120ms;
      --duration-fast: 160ms;
      --duration-exit: 180ms;
      --duration-standard: 240ms;
      --duration-morph: 400ms;
      --duration-snappy: 260ms;

      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-exit: cubic-bezier(0.7, 0, 0.84, 0);
      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      /* 官方 morph 曲线：从容平滑，微阻尼收敛，杜绝过度超调晃动 */
      --ease-morph: cubic-bezier(0.16, 1, 0.3, 1);
      /* 官方 snappy 曲线：按压微回弹 */
      --ease-snappy: cubic-bezier(0.18, 0.89, 0.32, 1.12);

      color-scheme: light;
      --bg-page: #fbfbfb;
      --stage-bg: #f8f8f8;
      --stage-border: #eeeeee;

      --foreground: #0b0b0b;
      --background: #ffffff;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-muted: #f2f2f2;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text-muted: #888888;
      --text-secondary: #555555;
      --danger: #e03131;
      --control-on: #0b0b0b;

      --radius-control: 18px;
      --radius-surface: 34px;
      --radius-pill: 9999px;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-raised: 0 4px 14px rgba(0, 0, 0, 0.08);
      --shadow-floating: 0 20px 48px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.03);

      --font-display: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #1a1a1a;
      --stage-bg: #242424;
      --stage-border: #2e2e2e;

      --foreground: #ffffff;
      --background: #191919;
      --surface: #1e1e1e;
      --surface-raised: #282828;
      --surface-muted: #2a2a2a;
      --border: #2e2e2e;
      --border-subtle: #252525;
      --text-muted: #919191;
      --text-secondary: #b5b5b5;
      --danger: #f56a65;
      --control-on: #ffffff;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-raised: 0 6px 18px rgba(0, 0, 0, 0.5);
      --shadow-floating: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-display);
      background-color: var(--bg-page);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.015em;
    }

    /* 顶部控制栏 */
    .arc-standalone-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 880px;
      height: 48px;
      background: color-mix(in oklab, var(--surface) 80%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    .bar-meta { display: flex; align-items: center; gap: 10px; }
    .bar-meta .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    .bar-meta .title { font-size: 13px; font-weight: 700; }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-resting);
      transition: transform 0.15s var(--ease-snappy);
    }
    .theme-toggle-btn:active { transform: scale(0.90); }

    /* 中央舞台：官方 1:1 画布架构 */
    .arc-stage {
      width: 100%;
      max-width: 880px;
      min-height: 460px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      border-radius: var(--radius-surface);
      box-shadow: var(--shadow-floating);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      margin-top: 40px;
      position: relative;
    }

    .demo-canvas {
      position: relative;
      width: 100%;
      max-width: 620px;
      height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .demo-top-row {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .demo-bottom-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      margin-top: auto;
    }

    /* ── Floating Button Group 官方设计规范核心 ── */
    .fbg-group {
      --fbg-h: 36px;
      --fbg-pad: 4px;
      --fbg-gap: 4px;
      --fbg-pad-x: 12px;
      --fbg-outer: var(--radius-control);
      --fbg-radius: calc(var(--fbg-outer) - var(--fbg-pad) - 1px);
      --fbg-highlight: color-mix(in oklab, var(--foreground) 7%, transparent);
      --fbg-highlight-press: color-mix(in oklab, var(--foreground) 12%, transparent);
      --fbg-on: color-mix(in oklab, var(--control-on) 12%, transparent);
      --fbg-rule: color-mix(in oklab, var(--foreground) 12%, transparent);
      --fbg-tray: color-mix(in oklab, var(--foreground) 4.5%, transparent);
      --fbg-tray-edge: color-mix(in oklab, var(--foreground) 3%, transparent);

      position: relative;
      isolation: isolate;
      display: inline-flex;
      flex: none;
      flex-wrap: nowrap;
      align-items: center;
      gap: var(--fbg-gap);
      padding: var(--fbg-pad);
      border: 1px solid var(--fbg-tray-edge);
      border-radius: var(--fbg-outer);
      background: var(--fbg-tray);
      color: var(--text-secondary);
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    [data-theme="dark"] .fbg-group {
      --fbg-highlight: color-mix(in oklab, var(--foreground) 9%, transparent);
      --fbg-highlight-press: color-mix(in oklab, var(--foreground) 15%, transparent);
      --fbg-on: color-mix(in oklab, var(--control-on) 16%, transparent);
      --fbg-tray: color-mix(in oklab, var(--foreground) 6%, transparent);
      --fbg-tray-edge: color-mix(in oklab, var(--foreground) 5%, transparent);
    }

    /* Small 尺寸 (30px) */
    .fbg-group.sm {
      --fbg-h: 30px;
      --fbg-pad: 3px;
      --fbg-gap: 3px;
      --fbg-pad-x: 10px;
      --fbg-outer: calc(var(--radius-control) - 3px);
    }

    /* Floating 变体 (层级浮动带投影阴影) */
    .fbg-group.floating {
      border-color: var(--border);
      background: var(--surface-raised);
      box-shadow: var(--shadow-floating);
    }

    /* Vertical 变体 (竖向排布) */
    .fbg-group.vertical {
      flex-direction: column;
      align-items: stretch;
    }

    /* ── 单共享物理滑块 ── */
    .fbg-highlight {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 0;
      border-radius: var(--fbg-radius);
      background: var(--fbg-highlight);
      pointer-events: none;
      opacity: 0;
      /* 初始与淡出时仅对透明度和按压颜色过渡，不发生多余位移 */
      transition: background-color var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-standard) var(--ease-standard);
      will-change: transform, width, height, opacity;
    }
    /* 在托盘内跨按钮移动：使用官方 400ms morph 曲线 */
    .fbg-highlight.fbg-morphing {
      transition: transform var(--duration-morph) var(--ease-morph),
                  width var(--duration-morph) var(--ease-morph),
                  height var(--duration-morph) var(--ease-morph),
                  background-color var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard);
    }
    /* 首次从外部进入：原地缩放弹性淡入，绝不从 (0,0) 划过 */
    .fbg-highlight.fbg-entering {
      transition: transform var(--duration-snappy) var(--ease-snappy),
                  opacity var(--duration-fast) var(--ease-standard),
                  background-color var(--duration-fast) var(--ease-standard);
    }
    .fbg-highlight.active {
      opacity: 1;
    }
    .fbg-highlight.pressing {
      background: var(--fbg-highlight-press);
      transition-duration: var(--duration-instant);
    }

    /* ── 按钮项 ── */
    .fbg-item {
      display: inline-flex;
      min-width: var(--fbg-h);
      height: var(--fbg-h);
      flex: none;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0 var(--fbg-pad-x);
      border: 0;
      border-radius: var(--fbg-radius);
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      outline: none;
      transition: color var(--duration-fast) var(--ease-standard),
                  background-color var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard);
    }

    .fbg-group.sm .fbg-item {
      font-size: 12px;
    }

    .fbg-item[data-icon]:not([data-icon-only]) {
      padding-left: calc(var(--fbg-pad-x) - 2px);
    }

    .fbg-item[data-icon-only] {
      width: var(--fbg-h);
      padding: 0;
    }

    .fbg-item:hover, .fbg-item[data-active], .fbg-item[aria-pressed="true"] {
      color: var(--foreground);
    }

    .fbg-item[aria-pressed="true"] {
      background: var(--fbg-on);
    }

    .fbg-item[aria-disabled="true"] {
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: .5;
    }

    .fbg-group.vertical .fbg-item:not([data-icon-only]) {
      justify-content: flex-start;
    }
    .fbg-group.vertical .fbg-item[data-icon-only] {
      align-self: center;
    }

    /* ── 槽位网格与预留 Ghost 宽度 ── */
    .fbg-slot {
      position: relative;
      z-index: 2;
      display: inline-grid;
      align-items: center;
      justify-items: center;
    }
    .fbg-slot > * {
      grid-area: 1 / 1;
    }
    .fbg-group.vertical .fbg-slot {
      justify-items: start;
    }

    .fbg-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
    }
    .fbg-iconSpace {
      display: block;
      width: 16px;
      height: 16px;
      flex: none;
    }

    .fbg-phase {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: opacity var(--duration-fast) var(--ease-enter),
                  filter var(--duration-fast) var(--ease-enter);
    }

    .fbg-icon {
      display: inline-flex;
      flex: none;
      width: 16px;
      height: 16px;
      stroke-width: 1.85;
    }
    .fbg-group.sm .fbg-icon {
      width: 14px;
      height: 14px;
    }

    .fbg-text {
      display: block;
    }

    /* ── 分割线 ── */
    .fbg-separator {
      flex: none;
      align-self: center;
      width: 1px;
      height: calc(var(--fbg-h) * 0.5);
      margin-inline: 2px;
      border-radius: 1px;
      background: var(--fbg-rule);
    }
    .fbg-group.vertical .fbg-separator {
      width: calc(var(--fbg-h) * 0.5);
      height: 1px;
      margin: 2px 0;
    }

    /* ── 官方悬浮气泡提示 (Tooltip) ── */
    .fbg-tooltip {
      position: fixed;
      z-index: 120;
      padding: 5px 9px;
      background: var(--foreground);
      color: var(--background);
      border-radius: var(--radius-control);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      box-shadow: var(--shadow-raised);
      pointer-events: none;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: scale(0.96);
      /* 初次进入与退场动画快而干脆 */
      transition: opacity 100ms var(--ease-standard),
                  transform 100ms var(--ease-standard);
      will-change: transform, opacity, top, left;
    }
    .fbg-tooltip.is-visible {
      opacity: 1;
      transform: scale(1);
    }
    /* 在已激活状态下连续跨项移动：启用快速平滑位移跟随 */
    .fbg-tooltip.is-visible.is-moving {
      transition: top 140ms var(--ease-morph),
                  left 140ms var(--ease-morph),
                  opacity 100ms var(--ease-standard),
                  transform 100ms var(--ease-standard);
    }
    .fbg-tooltip kbd {
      font-family: inherit;
      color: color-mix(in oklab, var(--background) 58%, var(--foreground));
      font-size: 11px;
    }

    .hint-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 36px;
      letter-spacing: -0.01em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  
    /* 嵌入宿主模式适配 */
    body.is-embedded {
      padding: 0 !important;
      background: transparent !important;
      min-height: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    body.is-embedded .arc-standalone-bar {
      display: none !important;
    }
    body.is-embedded .stage-card, 
    body.is-embedded .stage-box, 
    body.is-embedded .main-stage,
    body.is-embedded .container,
    body.is-embedded .wrapper {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
    }

  
    body.is-embedded .stage-toolbar,
    body.is-embedded .standalone-header { display: none !important; }
    body.is-embedded .arc-stage-card { border: none !important; box-shadow: none !important; background: transparent !important; margin: 0 !important; }


/* 宿主嵌入统一强力去重样式 */
body.is-embedded .stage-toolbar,
body.is-embedded .arc-standalone-bar,
body.is-embedded .standalone-header {
  display: none !important;
}
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-box,
body.is-embedded .main-stage {
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
  margin: 0 !important;
  min-height: auto !important;
  width: 100% !important;
}
body.is-embedded {
  padding: 0 !important;
  background: transparent !important;
  min-height: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}


/* 嵌入模式彻底消除滚动条与强制居中 */
html.is-embedded, body.is-embedded {
  overflow: hidden !important;
  height: 100% !important;
  min-height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
body.is-embedded::-webkit-scrollbar,
html.is-embedded::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
body.is-embedded .arc-stage,
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-content {
  margin: 0 !important;
  padding: 24px !important;
  min-height: auto !important;
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
}

</style>
</head>
<body>

  <!-- 顶部控制栏 -->
  <header class="arc-standalone-bar">
    <div class="bar-meta">
      <span class="badge">01_Buttons</span>
      <span class="title">Floating button group (floating-button-group)</span>
    </div>
    <div class="bar-controls">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换暗黑/浅色模式 (快捷键: D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <!-- 主舞台 -->
  <main class="arc-stage">
    <div class="demo-canvas">
      <!-- ── 1. 顶部水平主栏 (Editor actions · md · muted) ── -->
      <!-- [ ↶ | ↷ (disabled) | 💬 | 🔗 Share | ▷ Present ] -->
      <div class="demo-top-row">
        <div role="toolbar" aria-label="Editor actions" aria-orientation="horizontal" class="fbg-group md" data-variant="muted" id="trayEditor">
          <div class="fbg-highlight"></div>

          <!-- Undo -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Undo" data-tip="Undo" data-shortcut="⌘Z" tabindex="0">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 14 4 9l5-5"/>
                  <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/>
                </svg>
              </span>
            </span>
          </button>

          <!-- Redo (Disabled) -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Redo" aria-disabled="true" data-tip="Redo" data-shortcut="⌘⇧Z" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 14 5-5-5-5"/>
                  <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/>
                </svg>
              </span>
            </span>
          </button>

          <span class="fbg-separator" role="separator" aria-orientation="vertical"></span>

          <!-- Comment -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Comment" aria-pressed="false" data-tip="Comment" data-shortcut="⌘M" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>
                </svg>
              </span>
            </span>
          </button>

          <!-- Share (带 Copied 预留宽度) -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" aria-label="Share" tabindex="-1" id="btnShareItem">
            <span class="fbg-slot">
              <!-- Ghost 预留 widest 宽度 -->
              <span class="fbg-ghost"><span class="fbg-iconSpace"></span><span class="fbg-text">Share</span></span>
              <span class="fbg-ghost"><span class="fbg-iconSpace"></span><span class="fbg-text">Copied</span></span>
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
                  <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
                  <line x1="8" x2="16" y1="12" y2="12"/>
                </svg>
                <span class="fbg-text" id="shareText">Share</span>
              </span>
            </span>
          </button>

          <span class="fbg-separator" role="separator" aria-orientation="vertical"></span>

          <!-- Present (带 Stop 预留宽度) -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" aria-label="Present" aria-pressed="false" tabindex="-1" id="btnPresentItem">
            <span class="fbg-slot">
              <!-- Ghost 预留 widest 宽度 -->
              <span class="fbg-ghost"><span class="fbg-iconSpace"></span><span class="fbg-text">Present</span></span>
              <span class="fbg-ghost"><span class="fbg-iconSpace"></span><span class="fbg-text">Stop</span></span>
              <span class="fbg-phase">
                <svg class="fbg-icon" id="presentIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
                </svg>
                <span class="fbg-text" id="presentText">Present</span>
              </span>
            </span>
          </button>
        </div>
      </div>

      <!-- ── 底部排布：左侧竖向栏 + 右侧横向悬浮栏 ── -->
      <div class="demo-bottom-row">
        <!-- ── 2. 左侧竖向栏 (Canvas tools · md · vertical · muted) ── -->
        <!-- [ 🔍+ | 🔍- | ⛶ (disabled) | 🔒 | 👁 ] -->
        <div role="toolbar" aria-label="Canvas tools" aria-orientation="vertical" class="fbg-group md vertical" data-variant="muted" id="trayCanvas">
          <div class="fbg-highlight"></div>

          <!-- Zoom in -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Zoom in" data-tip="Zoom in" data-shortcut="⌘+" tabindex="0">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  <line x1="11" y1="8" x2="11" y2="14"/>
                  <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
              </span>
            </span>
          </button>

          <!-- Zoom out -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Zoom out" data-tip="Zoom out" data-shortcut="⌘-" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
              </span>
            </span>
          </button>

          <!-- Zoom to fit (Disabled) -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Zoom to fit" aria-disabled="true" data-tip="Zoom to fit" data-shortcut="⌘0" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                  <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                  <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                  <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                </svg>
              </span>
            </span>
          </button>

          <span class="fbg-separator" role="separator" aria-orientation="horizontal"></span>

          <!-- Lock layer -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Lock layer" aria-pressed="false" data-tip="Lock layer" data-shortcut="⌘L" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
            </span>
          </button>

          <!-- Hide layer -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Hide layer" aria-pressed="false" data-tip="Hide layer" data-shortcut="⌘H" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </span>
            </span>
          </button>
        </div>

        <!-- ── 3. 右侧横向悬浮操作栏 (Message actions · sm · floating) ── -->
        <!-- [ ⧉ | 📌 | 📥 | 🗑 (disabled) ] -->
        <div role="toolbar" aria-label="Message actions" aria-orientation="horizontal" class="fbg-group floating sm" data-variant="floating" id="trayMessage">
          <div class="fbg-highlight"></div>

          <!-- Copy text -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Copy text" data-tip="Copy text" data-shortcut="⌘C" tabindex="0">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
              </span>
            </span>
          </button>

          <!-- Pin message -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Pin message" aria-pressed="false" data-tip="Pin message" data-shortcut="⌘P" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 17v5"/>
                  <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
                </svg>
              </span>
            </span>
          </button>

          <!-- Archive -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Archive" data-tip="Archive" data-shortcut="⌘E" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="5" x="2" y="3" rx="1"/>
                  <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
                  <path d="M10 12h4"/>
                </svg>
              </span>
            </span>
          </button>

          <span class="fbg-separator" role="separator" aria-orientation="vertical"></span>

          <!-- Delete (Disabled) -->
          <button type="button" class="fbg-item" data-fbg-item="" data-icon="" data-icon-only="" aria-label="Delete" aria-disabled="true" data-tip="Delete" data-shortcut="⌫" tabindex="-1">
            <span class="fbg-slot">
              <span class="fbg-phase">
                <svg class="fbg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 11v6"/>
                  <path d="M14 11v6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                  <path d="M3 6h18"/>
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- 浮动提示浮层 -->
    <div class="fbg-tooltip" id="globalTooltip" role="tooltip" aria-hidden="true"></div>

    <span class="hint-text">Separate soft buttons in a quiet tray with one shared highlight that morphs as you move</span>
  </main>

  <script>

      // 嵌入检测与主题同步
      const params = new URLSearchParams(window.location.search);
      const isEmbedded = window.self !== window.top || params.get('embed') === 'true';
      if (isEmbedded) {
        document.body.classList.add('is-embedded'); document.documentElement.classList.add('is-embedded');
      }
      const urlTheme = params.get('theme');
      if (urlTheme) {
        document.documentElement.dataset.theme = urlTheme;
      }
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'ARC_THEME_CHANGE' && e.data.theme) {
          document.documentElement.dataset.theme = e.data.theme;
        }
      });

    (function init() {
      // 1. 主题切换
      const root = document.documentElement;
      const themeBtn = document.getElementById('themeToggleBtn');
      function toggleTheme() {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('arc_theme', next); } catch (e) {}
      }
      themeBtn.addEventListener('click', toggleTheme);
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'd' || e.key === 'D') && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) toggleTheme();
      });

      // 2. 官方极速灵动 Tooltip 浮层系统 (Radix Instant-Follow + 60ms Initial)
      const tooltip = document.getElementById('globalTooltip');
      let tipTimer = null;
      let isTipActive = false; // 是否处于活跃预热期
      let activeWarmTimer = null;
      let activeTipTarget = null;

      function renderTooltip(target, isMoving = false) {
        const tipText = target.dataset.tip;
        if (!tipText) {
          dismissTooltip();
          return;
        }
        const shortcut = target.dataset.shortcut;

        tooltip.innerHTML = `<span>${tipText}</span>${shortcut ? `<kbd>${shortcut}</kbd>` : ''}`;
        
        const rect = target.getBoundingClientRect();
        const tipRect = tooltip.getBoundingClientRect();
        const isVerticalTray = !!target.closest('.fbg-group.vertical');

        let top, left;

        if (isVerticalTray) {
          // 竖向栏放在右侧 (SideTip: side="right", sideOffset=10)
          top = rect.top + (rect.height - tipRect.height) / 2;
          left = rect.right + 10;
          if (left + tipRect.width > window.innerWidth - 8) {
            left = rect.left - tipRect.width - 10;
          }
        } else {
          // 水平栏默认放在上方，如果靠近顶部则放在下方
          top = rect.top - tipRect.height - 8;
          left = rect.left + (rect.width - tipRect.width) / 2;
          if (top < 10) {
            top = rect.bottom + 8;
          }
        }

        // 边界防溢出
        if (left < 8) left = 8;
        if (left + tipRect.width > window.innerWidth - 8) {
          left = window.innerWidth - tipRect.width - 8;
        }

        // 连续跨按钮移动时加上 is-moving 平滑位移过渡
        if (isMoving && tooltip.classList.contains('is-visible')) {
          tooltip.classList.add('is-moving');
        } else {
          tooltip.classList.remove('is-moving');
        }

        tooltip.style.top = `${Math.round(top)}px`;
        tooltip.style.left = `${Math.round(left)}px`;
        tooltip.classList.add('is-visible');

        isTipActive = true;
        clearTimeout(activeWarmTimer);
        activeTipTarget = target;
      }

      function queueTooltip(target, immediate = false) {
        clearTimeout(tipTimer);
        clearTimeout(activeWarmTimer);

        // 如果当前处于活跃期，或者指定 immediate（如键盘 focus），直接 0ms 瞬间跟随！
        if (immediate || isTipActive) {
          renderTooltip(target, isTipActive);
        } else {
          // 首次打开：仅 35ms 极微灵巧延迟，鼠标一碰即轻盈浮现
          tipTimer = setTimeout(() => {
            renderTooltip(target, false);
          }, 35);
        }
      }

      function dismissTooltip() {
        clearTimeout(tipTimer);
        tooltip.classList.remove('is-visible', 'is-moving');
        activeTipTarget = null;

        // 保留 350ms 的预热活跃窗口，在此期间移入下一个按钮依然是 0ms 瞬间跟随
        clearTimeout(activeWarmTimer);
        activeWarmTimer = setTimeout(() => {
          isTipActive = false;
        }, 350);
      }

      // 3. 官方物理高亮状态机 (Jump-on-Entry + Calm Morph + Boundary Stability)
      const trays = document.querySelectorAll('.fbg-group');

      trays.forEach(tray => {
        const highlight = tray.querySelector('.fbg-highlight');
        const items = Array.from(tray.querySelectorAll('[data-fbg-item]'));
        const isVertical = tray.classList.contains('vertical');

        let currentTarget = null;
        let isVisible = false;
        let isPressing = false;

        function measure(target) {
          const outer = tray.getBoundingClientRect();
          const box = target.getBoundingClientRect();
          const unscale = outer.width ? tray.offsetWidth / outer.width : 1;
          const dpr = window.devicePixelRatio || 1;
          const snap = (v) => Math.round(v * unscale * dpr) / dpr;
          return {
            x: snap(box.left - outer.left) - tray.clientLeft,
            y: snap(box.top - outer.top) - tray.clientTop,
            width: snap(box.width),
            height: snap(box.height)
          };
        }

        function place(target, mode) {
          if (!target || target.getAttribute('aria-disabled') === 'true') {
            fadeLeave();
            return;
          }

          const rect = measure(target);
          if (!rect) return;
          currentTarget = target;

          const scale = isPressing ? 0.965 : 1;

          if (!isVisible || mode === 'jump') {
            // 首次进入：直接 jump 定位到目标位置，杜绝从 (0,0) 划过的位移
            highlight.className = 'fbg-highlight';
            highlight.style.width = `${rect.width}px`;
            highlight.style.height = `${rect.height}px`;
            highlight.style.transform = `translate3d(${rect.x}px, ${rect.y}px, 0) scale(0.94)`;
            highlight.style.opacity = '0';

            // 强制重排
            void highlight.offsetHeight;

            // 启用优雅缩放淡入
            highlight.className = 'fbg-highlight fbg-entering' + (isPressing ? ' pressing' : '');
            highlight.style.transform = `translate3d(${rect.x}px, ${rect.y}px, 0) scale(${scale})`;
            highlight.style.opacity = '1';
            isVisible = true;
          } else {
            // 托盘内部连续滑动：平滑 morph 流动
            highlight.className = 'fbg-highlight fbg-morphing' + (isPressing ? ' pressing' : '');
            highlight.style.width = `${rect.width}px`;
            highlight.style.height = `${rect.height}px`;
            highlight.style.transform = `translate3d(${rect.x}px, ${rect.y}px, 0) scale(${scale})`;
            highlight.style.opacity = '1';
          }
        }

        function fadeLeave() {
          if (!isVisible) return;
          isVisible = false;
          currentTarget = null;
          isPressing = false;
          // 淡出时保持当前坐标与尺寸，仅 opacity 优雅降为 0
          highlight.className = 'fbg-highlight';
          highlight.style.opacity = '0';
        }

        items.forEach(item => {
          item.addEventListener('pointerenter', (e) => {
            if (e.pointerType === 'mouse' || e.pointerType === 'pen') {
              if (item.getAttribute('aria-disabled') !== 'true') {
                place(item, 'move');
              } else {
                fadeLeave();
              }
              if (item.dataset.tip) {
                queueTooltip(item);
              } else {
                dismissTooltip();
              }
            }
          });

          item.addEventListener('focus', () => {
            if (item.getAttribute('aria-disabled') !== 'true') {
              place(item, 'move');
            }
            if (item.dataset.tip) {
              queueTooltip(item, true);
            }
          });

          item.addEventListener('blur', () => {
            dismissTooltip();
          });

          item.addEventListener('pointerdown', (e) => {
            if (e.button === 0 && item.getAttribute('aria-disabled') !== 'true') {
              isPressing = true;
              place(item, 'move');
            }
          });

          item.addEventListener('pointerup', () => {
            if (isPressing) {
              isPressing = false;
              if (currentTarget) place(currentTarget, 'move');
            }
          });

          item.addEventListener('pointercancel', () => {
            if (isPressing) {
              isPressing = false;
              if (currentTarget) place(currentTarget, 'move');
            }
          });
        });

        // 托盘离开事件：保证掠过 separator 或内部缝隙时高亮不闪烁
        tray.addEventListener('pointerleave', () => {
          fadeLeave();
          dismissTooltip();
        });

        tray.addEventListener('focusout', (e) => {
          if (!tray.contains(e.relatedTarget)) {
            fadeLeave();
            dismissTooltip();
          }
        });

        // 键盘方向键无缝巡检
        tray.addEventListener('keydown', (e) => {
          const usableItems = items.filter(it => it.getAttribute('aria-disabled') !== 'true');
          const currentIndex = usableItems.indexOf(document.activeElement);
          if (currentIndex < 0) return;

          const nextKey = isVertical ? 'ArrowDown' : 'ArrowRight';
          const prevKey = isVertical ? 'ArrowUp' : 'ArrowLeft';

          if (e.key === nextKey) {
            e.preventDefault();
            const next = usableItems[(currentIndex + 1) % usableItems.length];
            next.focus();
          } else if (e.key === prevKey) {
            e.preventDefault();
            const prev = usableItems[(currentIndex - 1 + usableItems.length) % usableItems.length];
            prev.focus();
          } else if (e.key === 'Home') {
            e.preventDefault();
            usableItems[0]?.focus();
          } else if (e.key === 'End') {
            e.preventDefault();
            usableItems[usableItems.length - 1]?.focus();
          }
        });
      });

      // 4. 按钮交互响应逻辑
      // 4.1 Share 按钮点击反馈 (Share -> Copied)
      const btnShare = document.getElementById('btnShareItem');
      const shareText = document.getElementById('shareText');
      let shareTimer = null;

      btnShare.addEventListener('click', () => {
        clearTimeout(shareTimer);
        shareText.textContent = 'Copied';
        btnShare.setAttribute('aria-label', 'Copied');
        shareTimer = setTimeout(() => {
          shareText.textContent = 'Share';
          btnShare.setAttribute('aria-label', 'Share');
        }, 1600);
      });

      // 4.2 Present 按钮开关状态保持 (Present -> Stop, aria-pressed 切换)
      const btnPresent = document.getElementById('btnPresentItem');
      const presentText = document.getElementById('presentText');
      const presentIcon = document.getElementById('presentIcon');

      btnPresent.addEventListener('click', () => {
        const isPressed = btnPresent.getAttribute('aria-pressed') === 'true';
        const next = !isPressed;
        btnPresent.setAttribute('aria-pressed', String(next));

        if (next) {
          presentText.textContent = 'Stop';
          presentIcon.innerHTML = '<rect width="14" height="14" x="5" y="5" rx="1.5"/>';
          btnPresent.setAttribute('aria-label', 'Stop presentation');
        } else {
          presentText.textContent = 'Present';
          presentIcon.innerHTML = '<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>';
          btnPresent.setAttribute('aria-label', 'Present');
        }
      });

      // 4.3 其它开关按钮（Comment、Lock layer、Hide layer、Pin message）的 aria-pressed 切换
      const toggleButtons = document.querySelectorAll('[aria-pressed]');
      toggleButtons.forEach(btn => {
        if (btn === btnPresent) return;
        btn.addEventListener('click', () => {
          const isPressed = btn.getAttribute('aria-pressed') === 'true';
          btn.setAttribute('aria-pressed', String(!isPressed));
        });
      });
    })();
  </script>
</body>
