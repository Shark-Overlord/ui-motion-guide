<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc UI · Action button (action-button)</title>
  <style>
    :root {
      /* ── Arc UI Motion Tokens ── */
      --duration-instant: 120ms;
      --duration-fast: 160ms;
      --duration-exit: 180ms;
      --duration-standard: 240ms;
      --duration-spring: 420ms;

      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-exit: cubic-bezier(0.7, 0, 0.84, 0);
      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-snappy: cubic-bezier(0.18, 0.89, 0.32, 1.28);
      --ease-morph: cubic-bezier(0.16, 1, 0.3, 1);

      color-scheme: light;
      --bg-page: #fbfbfb;
      --stage-bg: #f8f8f8;
      --stage-border: #eeeeee;

      --btn-bg: #0b0b0b;
      --btn-color: #ffffff;
      --btn-border: #0b0b0b;

      --text-muted: #888888;
      --text-secondary: #555555;
      --foreground: #0b0b0b;
      --surface: #ffffff;
      --surface-muted: #f2f2f2;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --success: #10b981;

      --radius-control: 18px;
      --radius-panel: 24px;
      --radius-surface: 34px;
      --radius-pill: 9999px;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-raised: 0 4px 14px rgba(0, 0, 0, 0.08);
      --shadow-floating: 0 20px 48px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.02);

      --font-display: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #1a1a1a;
      --stage-bg: #242424;
      --stage-border: #2e2e2e;

      --btn-bg: #f2f2f2;
      --btn-color: #191919;
      --btn-border: #f2f2f2;

      --text-muted: #919191;
      --text-secondary: #b5b5b5;
      --foreground: #ffffff;
      --surface: #242424;
      --surface-muted: #1e1e1e;
      --border: #2e2e2e;
      --border-subtle: #252525;
      --success: #34d399;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-raised: 0 6px 18px rgba(0, 0, 0, 0.5);
      --shadow-floating: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-display);
      background-color: var(--bg-page);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.015em;
    }

    /* 顶部控制栏 */
    .arc-standalone-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 880px;
      height: 48px;
      background: color-mix(in oklab, var(--surface) 80%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-raised);
      z-index: 100;
    }

    .bar-meta { display: flex; align-items: center; gap: 10px; }
    .bar-meta .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    .bar-meta .title { font-size: 13px; font-weight: 700; }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-resting);
      transition: transform 0.15s var(--ease-snappy);
    }
    .theme-toggle-btn:active { transform: scale(0.90); }

    /* 中央舞台 */
    .arc-stage {
      width: 100%;
      max-width: 880px;
      min-height: 420px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      border-radius: var(--radius-surface);
      box-shadow: var(--shadow-floating);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      margin-top: 40px;
      position: relative;
    }

    .action-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── Action Button 官方 1:1 核心样式 ── */
    .arc-action-btn {
      position: relative;
      display: inline-flex;
      height: 40px;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 20px;
      border: 1px solid var(--btn-border);
      border-radius: var(--radius-pill);
      background: var(--btn-bg);
      color: var(--btn-color);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      box-shadow: var(--shadow-resting);
      transition: transform var(--duration-instant) var(--ease-standard),
                  background-color var(--duration-fast) var(--ease-standard),
                  border-color var(--duration-fast) var(--ease-standard),
                  color var(--duration-fast) var(--ease-standard),
                  box-shadow var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard);
      will-change: transform;
    }

    @media (hover: hover) and (pointer: fine) {
      .arc-action-btn:hover:not(:disabled) {
        opacity: 0.92;
        box-shadow: var(--shadow-raised);
      }
    }

    .arc-action-btn:active:not(:disabled) {
      transform: scale(0.97);
      opacity: 0.86;
    }

    .arc-action-btn[data-state="pending"] {
      cursor: progress;
    }

    .btn-content {
      display: inline-flex;
      min-height: 1.25rem;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    /* ── 逐字形态文本槽 (MorphText & popLayout 零抖动物理形变) ── */
    .morph-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      overflow: visible;
      transition: width var(--duration-spring) var(--ease-morph);
      will-change: width;
    }

    .glyphs-row {
      position: relative;
      display: inline-flex;
      align-items: center;
      white-space: pre;
    }

    .glyph-item {
      display: inline-block;
      white-space: pre;
      will-change: transform, opacity, filter;
      transition: transform var(--duration-standard) var(--ease-enter),
                  opacity var(--duration-standard) var(--ease-enter),
                  filter var(--duration-standard) var(--ease-enter);
    }

    .glyph-item.glyph-in {
      opacity: 0;
      transform: translateY(5px);
      filter: blur(4px);
    }

    .glyph-item.glyph-rest {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0px);
    }

    /* popLayout 关键点：退场字符脱离文档流，杜绝撑宽导致急坠抖动 */
    .glyph-item.glyph-out {
      position: absolute;
      top: 0;
      opacity: 0 !important;
      transform: translateY(-5px) !important;
      filter: blur(2px) !important;
      pointer-events: none;
      transition: transform var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard),
                  filter var(--duration-fast) var(--ease-standard) !important;
    }

    /* ── 右侧固定 17×17 图标插槽 (IconSlot) ── */
    .icon-slot {
      display: grid;
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      place-items: center;
      position: relative;
    }

    .phase-icon {
      grid-area: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      pointer-events: none;
      will-change: transform, opacity, filter;
      transition: transform var(--duration-standard) var(--ease-snappy),
                  opacity var(--duration-fast) var(--ease-enter),
                  filter var(--duration-fast) var(--ease-enter);
    }

    /* 1. 箭头物理流转 */
    .icon-arrow {
      opacity: 1;
      transform: translateX(0);
      filter: blur(0);
    }
    .icon-arrow.arrow-leave {
      opacity: 0;
      transform: translateX(8px);
      filter: blur(2px);
      transition: transform var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard),
                  filter var(--duration-fast) var(--ease-standard);
    }
    .icon-arrow.arrow-enter-from-behind {
      opacity: 0;
      transform: translateX(-6px);
      filter: blur(2px);
    }

    /* 2. Spinner 旋转圈 */
    .icon-spinner {
      opacity: 0;
      transform: scale(0.6);
      filter: blur(2px);
    }
    .icon-spinner.active {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
    .spinner-ring {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1.5px solid currentColor;
      border-right-color: transparent;
      border-radius: var(--radius-pill);
      animation: arcSpin 0.7s linear infinite;
    }
    @keyframes arcSpin {
      to { transform: rotate(360deg); }
    }

    /* 3. DrawnCheck 真实笔触手写对号 */
    .icon-check {
      opacity: 0;
      transform: scale(0.6);
      filter: blur(2px);
      color: var(--success);
    }
    .icon-check.active {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
    .drawn-check-path {
      stroke: currentColor;
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      transition: stroke-dashoffset var(--duration-standard) var(--ease-enter) 0.05s;
    }
    .icon-check.active .drawn-check-path {
      stroke-dashoffset: 0;
    }

    .hint-text {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  
    /* 嵌入宿主模式适配 */
    body.is-embedded {
      padding: 0 !important;
      background: transparent !important;
      min-height: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    body.is-embedded .arc-standalone-bar {
      display: none !important;
    }
    body.is-embedded .stage-card, 
    body.is-embedded .stage-box, 
    body.is-embedded .main-stage,
    body.is-embedded .container,
    body.is-embedded .wrapper {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
    }

  
    body.is-embedded .stage-toolbar,
    body.is-embedded .standalone-header { display: none !important; }
    body.is-embedded .arc-stage-card { border: none !important; box-shadow: none !important; background: transparent !important; margin: 0 !important; }


/* 宿主嵌入统一强力去重样式 */
body.is-embedded .stage-toolbar,
body.is-embedded .arc-standalone-bar,
body.is-embedded .standalone-header {
  display: none !important;
}
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-box,
body.is-embedded .main-stage {
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
  margin: 0 !important;
  min-height: auto !important;
  width: 100% !important;
}
body.is-embedded {
  padding: 0 !important;
  background: transparent !important;
  min-height: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}


/* 嵌入模式彻底消除滚动条与强制居中 */
html.is-embedded, body.is-embedded {
  overflow: hidden !important;
  height: 100% !important;
  min-height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
body.is-embedded::-webkit-scrollbar,
html.is-embedded::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
body.is-embedded .arc-stage,
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-content {
  margin: 0 !important;
  padding: 24px !important;
  min-height: auto !important;
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
}

</style>
</head>
<body>

  <!-- 顶部控制栏 -->
  <header class="arc-standalone-bar">
    <div class="bar-meta">
      <span class="badge">01_Buttons</span>
      <span class="title">Action button (action-button)</span>
    </div>
    <div class="bar-controls">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换暗黑/浅色模式 (快捷键: D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <!-- 主舞台 -->
  <main class="arc-stage">
    <div class="action-btn-container">
      <!-- 官方 1:1 Action Button 控件 -->
      <button class="arc-action-btn" id="mainActionBtn" data-state="idle" type="button" aria-live="polite">
        <span class="btn-content" aria-hidden="true">
          <!-- 逐字形态文本槽 -->
          <span class="morph-slot" id="morphSlot">
            <span class="glyphs-row" id="glyphsRow"></span>
          </span>

          <!-- 右侧固定 17×17 图标插槽 -->
          <span class="icon-slot">
            <!-- 1. Arrow Right (Idle) -->
            <svg class="phase-icon icon-arrow" id="iconArrow" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
            <!-- 2. Spinner (Pending) -->
            <span class="phase-icon icon-spinner" id="iconSpinner">
              <span class="spinner-ring"></span>
            </span>
            <!-- 3. DrawnCheck (Success) -->
            <svg class="phase-icon icon-check" id="iconCheck" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path class="drawn-check-path" d="M4 12l5 5L20 6"></path>
            </svg>
          </span>
        </span>
      </button>

      <span class="hint-text">Click to trigger async commit and auto-reset feedback</span>
    </div>
  </main>

  <script>

      // 嵌入检测与主题同步
      const params = new URLSearchParams(window.location.search);
      const isEmbedded = window.self !== window.top || params.get('embed') === 'true';
      if (isEmbedded) {
        document.body.classList.add('is-embedded'); document.documentElement.classList.add('is-embedded');
      }
      const urlTheme = params.get('theme');
      if (urlTheme) {
        document.documentElement.dataset.theme = urlTheme;
      }
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'ARC_THEME_CHANGE' && e.data.theme) {
          document.documentElement.dataset.theme = e.data.theme;
        }
      });

    (function init() {
      // 1. 主题切换
      const root = document.documentElement;
      const themeBtn = document.getElementById('themeToggleBtn');
      function toggleTheme() {
        const current = root.dataset.theme;
        const next = current === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('arc_theme', next); } catch (e) {}
      }
      themeBtn.addEventListener('click', toggleTheme);
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'd' || e.key === 'D') && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
          toggleTheme();
        }
      });

      // 2. DOM 元素缓存
      const btn = document.getElementById('mainActionBtn');
      const morphSlot = document.getElementById('morphSlot');
      const glyphsRow = document.getElementById('glyphsRow');
      const iconArrow = document.getElementById('iconArrow');
      const iconSpinner = document.getElementById('iconSpinner');
      const iconCheck = document.getElementById('iconCheck');

      let currentState = 'idle';
      let resetTimer = null;

      // 3. 官方 popLayout 逐字形态比对融合引擎
      function updateTextMorph(newText) {
        const currentSpans = Array.from(glyphsRow.children).filter(s => !s.classList.contains('glyph-out'));
        const oldText = currentSpans.map(s => s.textContent).join('');

        if (oldText === newText) return;

        // 计算公共前后缀
        let start = 0;
        while (start < oldText.length && start < newText.length && oldText[start] === newText[start]) {
          start++;
        }
        let end = 0;
        while (end < (oldText.length - start) && end < (newText.length - start) &&
               oldText[oldText.length - 1 - end] === newText[newText.length - 1 - end]) {
          end++;
        }

        // A. 关键 popLayout：退场字符在 t=0 脱离流式排版，记录绝对位置
        const leavingSpans = currentSpans.slice(start, oldText.length - end);
        leavingSpans.forEach(s => {
          const leftOffset = s.offsetLeft;
          s.style.left = `${leftOffset}px`;
          s.classList.remove('glyph-rest', 'glyph-in');
          s.classList.add('glyph-out');
        });

        // B. 创建进入字符 (glyph-in)
        const incomingChars = newText.slice(start, newText.length - end);
        const incomingSpans = [];
        for (let i = 0; i < incomingChars.length; i++) {
          const span = document.createElement('span');
          span.className = 'glyph-item glyph-in';
          span.textContent = incomingChars[i];
          span.style.transitionDelay = `${Math.min(i * 18, 100)}ms`;
          incomingSpans.push(span);
        }

        // C. 插入到正确的锚点
        const insertAnchor = currentSpans[oldText.length - end] || null;
        incomingSpans.forEach(span => {
          glyphsRow.insertBefore(span, insertAnchor);
        });

        // D. 测量新文本自然排版宽度并启动丝滑形变
        const targetWidth = glyphsRow.offsetWidth;
        morphSlot.style.width = `${targetWidth}px`;

        // E. 下一帧激活进入字符升起动画
        requestAnimationFrame(() => {
          incomingSpans.forEach(span => {
            span.classList.remove('glyph-in');
            span.classList.add('glyph-rest');
          });
        });

        // F. 退场动画完成后彻底移除废弃节点
        setTimeout(() => {
          leavingSpans.forEach(s => s.remove());
        }, 180);
      }

      // 初始化初始字符
      function initText(initialText) {
        glyphsRow.innerHTML = '';
        for (let i = 0; i < initialText.length; i++) {
          const span = document.createElement('span');
          span.className = 'glyph-item glyph-rest';
          span.textContent = initialText[i];
          glyphsRow.appendChild(span);
        }
        morphSlot.style.width = `${glyphsRow.offsetWidth}px`;
      }

      // 官方对标：初始态为 "Save changes"
      initText('Save changes');

      // 4. 状态机与方向性图标物理流转
      function setState(nextState) {
        if (currentState === nextState) return;
        currentState = nextState;
        btn.dataset.state = nextState;

        if (nextState === 'pending') {
          // ── 【Pending 态】 ──
          // 1. 文本流转: Save changes -> Saving
          updateTextMorph('Saving');

          // 2. 箭头顺向往右飞出淡出
          iconArrow.classList.add('arrow-leave');

          // 3. Spinner 顺畅显现
          setTimeout(() => {
            iconSpinner.classList.add('active');
          }, 80);

        } else if (nextState === 'success') {
          // ── 【Success 态】 ──
          // 1. 文本流转: Saving -> Saved
          updateTextMorph('Saved');

          // 2. Spinner 退出
          iconSpinner.classList.remove('active');

          // 3. DrawnCheck 真实笔触书写动画
          setTimeout(() => {
            iconCheck.classList.add('active');
          }, 60);

        } else if (nextState === 'idle') {
          // ── 【自动复原 Idle 态】 ──
          // 1. 文本流转: Saved -> Save changes
          updateTextMorph('Save changes');

          // 2. Check 退出
          iconCheck.classList.remove('active');

          // 3. 箭头从后方（左侧 -6px）飞入复位
          iconArrow.classList.remove('arrow-leave');
          iconArrow.classList.add('arrow-enter-from-behind');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              iconArrow.classList.remove('arrow-enter-from-behind');
            });
          });
        }
      }

      // 5. 点击交互触发异步提交
      btn.addEventListener('click', () => {
        if (currentState !== 'idle') return;
        clearTimeout(resetTimer);

        setState('pending');

        // 模拟真实异步提交工作流 (1300ms 后成功)
        setTimeout(() => {
          setState('success');

          // 官方规范：成功展示 2400ms 后自动静止恢复到 Idle
          resetTimer = setTimeout(() => {
            setState('idle');
          }, 2400);
        }, 1300);
      });
    })();
  </script>
</body>
</html>
