<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc UI · Icon morph (icon-morph)</title>
  <style>
    :root {
      /* ── Arc UI Motion Tokens ── */
      --duration-instant: 120ms;
      --duration-fast: 160ms;
      --duration-standard: 240ms;
      --duration-spring: 360ms;

      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-snappy: cubic-bezier(0.18, 0.89, 0.32, 1.28);
      --ease-morph: cubic-bezier(0.34, 1.25, 0.64, 1);

      color-scheme: light;
      --bg-page: #fbfbfb;
      --stage-bg: #ffffff;
      --stage-border: #eeeeee;

      --foreground: #0b0b0b;
      --background: #ffffff;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-muted: #f4f4f4;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --text-muted: #888888;
      --text-secondary: #555555;

      /* 语义反馈色 */
      --success: #10b981;
      --icon-morph-like: #f43f5e;
      --danger: #f43f5e;
      --warning: #f59e0b;

      --radius-control: 20px;
      --radius-surface: 24px;
      --radius-pill: 9999px;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-raised: 0 4px 14px rgba(0, 0, 0, 0.08);
      --shadow-floating: 0 20px 48px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.03);

      --font-display: -apple-system, BlinkMacSystemFont, "Geist", "Inter", "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #141414;
      --stage-bg: #1a1a1a;
      --stage-border: #282828;

      --foreground: #f4f4f4;
      --background: #141414;
      --surface: #222222;
      --surface-raised: #282828;
      --surface-muted: #2a2a2a;
      --border: #303030;
      --border-strong: #444444;
      --border-subtle: #242424;
      --text-muted: #8e8e8e;
      --text-secondary: #aaaaaa;

      --success: #34d399;
      --icon-morph-like: #fb7185;
      --danger: #fb7185;

      --shadow-resting: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-raised: 0 6px 18px rgba(0, 0, 0, 0.5);
      --shadow-floating: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-display);
      background-color: var(--bg-page);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.015em;
    }

    /* 顶部控制栏 */
    .arc-standalone-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 880px;
      height: 48px;
      background: color-mix(in oklab, var(--surface) 80%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    .bar-meta { display: flex; align-items: center; gap: 10px; }
    .bar-meta .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    .bar-meta .title { font-size: 13px; font-weight: 700; }

    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-resting);
      transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .theme-toggle-btn:active { transform: scale(0.90); }

    /* 中央舞台 (100% 对齐 screenshots/01_Buttons/icon-morph.png) */
    .arc-stage-card {
      width: 100%;
      max-width: 880px;
      min-height: 480px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      border-radius: var(--radius-surface);
      box-shadow: var(--shadow-floating);
      display: flex;
      flex-direction: column;
      margin-top: 40px;
      position: relative;
      overflow: hidden;
    }

    .stage-toolbar {
      height: 52px;
      border-bottom: 1px solid var(--stage-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--stage-bg);
      user-select: none;
    }

    .stage-tabs {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stage-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      padding: 16px 0;
      position: relative;
      border: none;
      background: transparent;
      outline: none;
    }
    .stage-tab.active {
      color: var(--foreground);
      font-weight: 600;
    }
    .stage-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--foreground);
      border-radius: 1px;
    }

    .stage-hint {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stage-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 32px;
      position: relative;
    }

    /* ── Icon Morph 8 组网格 (4 列 × 2 行) ── */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 110px);
      gap: 16px;
      justify-content: center;
      user-select: none;
    }

    .icon-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 110px;
      height: 112px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      cursor: pointer;
      outline: none;
      box-shadow: var(--shadow-resting);
      transition: background-color var(--duration-fast) var(--ease-standard),
                  border-color var(--duration-fast) var(--ease-standard),
                  transform var(--duration-instant) var(--ease-standard),
                  box-shadow var(--duration-fast) var(--ease-standard);
      will-change: transform;
    }
    .icon-card:hover {
      background: var(--surface-muted);
      border-color: var(--border-strong);
    }
    .icon-card:active {
      transform: scale(0.95);
    }

    .card-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      transition: color var(--duration-fast) var(--ease-standard);
      white-space: nowrap;
    }

    /* 保证 SVG 及其动画溢出不被粗暴裁剪 */
    .morph-svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.75;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      overflow: visible !important;
      display: block;
      flex: none;
    }

    /* ── 1. Menu to Close (X) ── */
    .menu-line {
      transition: transform var(--duration-spring) var(--ease-morph),
                  opacity var(--duration-fast) var(--ease-standard);
      transform-origin: center;
    }
    .icon-card[data-active="true"] .menu-line-top {
      transform: translateY(6px) rotate(45deg);
    }
    .icon-card[data-active="true"] .menu-line-mid {
      opacity: 0;
      transform: scaleX(0.2);
    }
    .icon-card[data-active="true"] .menu-line-bot {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* ── 2. Play to Pause ── */
    .play-left, .play-right {
      fill: currentColor;
      stroke: none;
      transition: d var(--duration-spring) var(--ease-morph);
    }

    /* ── 3. Plus to Check (精准对勾变形 + 绿色赋予) ── */
    .plus-leg {
      transition: d var(--duration-spring) var(--ease-morph),
                  stroke var(--duration-fast) var(--ease-standard);
    }
    .icon-card[data-active="true"] .plus-leg {
      stroke: var(--success);
    }
    .icon-card[data-active="true"] .card-label-check {
      color: var(--success);
    }

    /* ── 4. Copy to Check (折叠淡出 + 绿色笔触对号展开) ── */
    .copy-back, .copy-front {
      transition: transform var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard);
    }
    .icon-card[data-active="true"] .copy-back {
      opacity: 0;
      transform: translate(4px, 4px);
    }
    .icon-card[data-active="true"] .copy-front {
      opacity: 0;
      transform: scale(0.7);
    }

    .copy-check-stroke {
      stroke-dasharray: 22;
      stroke-dashoffset: 22;
      stroke: var(--success);
      opacity: 0;
      transition: stroke-dashoffset var(--duration-spring) var(--ease-morph) 0.05s,
                  opacity var(--duration-instant) var(--ease-standard);
    }
    .icon-card[data-active="true"] .copy-check-stroke {
      opacity: 1;
      stroke-dashoffset: 0;
    }
    .icon-card[data-active="true"] .card-label-copy {
      color: var(--success);
    }

    /* ── 5. Theme (Sun to Moon) ── */
    .sun-rays {
      transition: transform var(--duration-spring) var(--ease-morph),
                  opacity var(--duration-fast) var(--ease-standard);
      transform-origin: center;
    }
    .icon-card[data-active="true"] .sun-rays {
      transform: rotate(90deg) scale(0.3);
      opacity: 0;
    }
    .sun-core-crescent {
      transition: r var(--duration-spring) var(--ease-morph);
    }
    .moon-shadow-mask {
      transition: cx var(--duration-spring) var(--ease-morph),
                  cy var(--duration-spring) var(--ease-morph);
    }
    .icon-card[data-active="true"] .moon-shadow-mask {
      cx: 18;
      cy: 6;
    }
    .icon-card[data-active="true"] .sun-core-crescent {
      r: 8.5;
    }

    /* ── 6. Chevron 180° Flip ── */
    .chevron-morph {
      transition: transform var(--duration-spring) var(--ease-snappy);
      transform-origin: center;
    }
    .icon-card[data-active="true"] .chevron-morph {
      transform: rotate(180deg);
    }

    /* ── 7. Bell Ring & Slash ── */
    .bell-group {
      transform-origin: 12px 2px;
      transition: transform var(--duration-spring) var(--ease-snappy);
    }
    .icon-card[data-active="true"] .bell-group {
      animation: bellSwing 0.85s ease-out;
    }
    @keyframes bellSwing {
      0% { transform: rotate(0); }
      15% { transform: rotate(16deg); }
      30% { transform: rotate(-13deg); }
      45% { transform: rotate(9deg); }
      60% { transform: rotate(-6deg); }
      75% { transform: rotate(3deg); }
      100% { transform: rotate(0); }
    }
    .bell-slash {
      stroke-dasharray: 26;
      stroke-dashoffset: 0;
      opacity: 1;
      transition: stroke-dashoffset var(--duration-fast) var(--ease-standard),
                  opacity var(--duration-fast) var(--ease-standard);
    }
    .icon-card[data-active="true"] .bell-slash {
      stroke-dashoffset: 26;
      opacity: 0;
    }

    /* ── 8. Heart Burst & Pop (100% 官方 Lucide 曲线，彻底杜绝平头裁剪) ── */
    .heart-svg-frame {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .heart-shape {
      transform-origin: 12px 12px;
      fill: transparent;
      stroke: currentColor;
      transition: fill var(--duration-fast) var(--ease-standard),
                  stroke var(--duration-fast) var(--ease-standard);
      will-change: transform, fill, stroke;
    }

    .icon-card[data-active="true"] .heart-shape {
      fill: var(--icon-morph-like);
      stroke: var(--icon-morph-like);
      animation: heartPop 0.45s var(--ease-enter) forwards;
    }

    @keyframes heartPop {
      0% { transform: scale(0.72); }
      50% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    /* 爆发光环 */
    .heart-burst-ring {
      position: absolute;
      inset: 0;
      width: 24px;
      height: 24px;
      pointer-events: none;
      overflow: visible;
    }
    .burst-circle {
      opacity: 0;
      fill: none;
      stroke: var(--icon-morph-like);
    }
    .icon-card[data-active="true"] .burst-circle {
      animation: burstRing 0.5s var(--ease-enter) forwards;
    }
    @keyframes burstRing {
      0% { r: 4px; stroke-width: 3px; opacity: 0.6; }
      100% { r: 13px; stroke-width: 0px; opacity: 0; }
    }

    /* 7 颗向外溅射的小火花 */
    .spark-dot {
      opacity: 0;
      fill: var(--icon-morph-like);
      transform-origin: 12px 12px;
    }
    .icon-card[data-active="true"] .spark-dot {
      animation: sparkBurst 0.55s var(--ease-enter) 0.04s forwards;
    }
    @keyframes sparkBurst {
      0% {
        transform: translate(calc(var(--sx) * 7px), calc(var(--sy) * 7px)) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(calc(var(--sx) * 14px), calc(var(--sy) * 14px)) scale(0.3);
        opacity: 0;
      }
    }

    .icon-card[data-active="true"] .card-label-heart {
      color: var(--icon-morph-like);
      font-weight: 600;
    }
  
    /* 嵌入宿主模式适配 */
    body.is-embedded {
      padding: 0 !important;
      background: transparent !important;
      min-height: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    body.is-embedded .arc-standalone-bar {
      display: none !important;
    }
    body.is-embedded .stage-card, 
    body.is-embedded .stage-box, 
    body.is-embedded .main-stage,
    body.is-embedded .container,
    body.is-embedded .wrapper {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
    }

  
/* 宿主嵌入统一强力去重样式 */
body.is-embedded .stage-toolbar,
body.is-embedded .arc-standalone-bar,
body.is-embedded .standalone-header {
  display: none !important;
}
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-box,
body.is-embedded .main-stage {
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
  margin: 0 !important;
  min-height: auto !important;
  width: 100% !important;
}
body.is-embedded {
  padding: 0 !important;
  background: transparent !important;
  min-height: auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}


/* 嵌入模式彻底消除滚动条与强制居中 */
html.is-embedded, body.is-embedded {
  overflow: hidden !important;
  height: 100% !important;
  min-height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
body.is-embedded::-webkit-scrollbar,
html.is-embedded::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
body.is-embedded .arc-stage,
body.is-embedded .arc-stage-card,
body.is-embedded .stage-card,
body.is-embedded .stage-content {
  margin: 0 !important;
  padding: 24px !important;
  min-height: auto !important;
  border: none !important;
  box-shadow: none !important;
  background: transparent !important;
}

</style>
</head>
<body>

  <!-- 顶部控制条 -->
  <header class="arc-standalone-bar">
    <div class="bar-meta">
      <span class="badge">01_Buttons</span>
      <span class="title">Icon morph (icon-morph)</span>
    </div>
    <div class="bar-controls">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换暗黑/浅色模式 (快捷键: D)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 舞台卡片 (100% 对齐 screenshots/01_Buttons/icon-morph.png) -->
  <main class="arc-stage-card">
    <div class="stage-toolbar">
      <div class="stage-tabs">
        <button class="stage-tab active" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <span>Preview</span>
        </button>
      </div>
      <span class="stage-hint">Live · keyboard ready</span>
    </div>

    <div class="stage-content">
      <div class="icon-grid" id="iconGrid">

        <!-- 1. Menu <-> Close -->
        <button class="icon-card" id="cardMenu" data-active="false" type="button">
          <svg class="morph-svg" viewBox="0 0 24 24">
            <line class="menu-line menu-line-top" x1="4" y1="6" x2="20" y2="6"/>
            <line class="menu-line menu-line-mid" x1="4" y1="12" x2="20" y2="12"/>
            <line class="menu-line menu-line-bot" x1="4" y1="18" x2="20" y2="18"/>
          </svg>
          <span class="card-label" id="labelMenu">Menu</span>
        </button>

        <!-- 2. Paused <-> Playing -->
        <button class="icon-card" id="cardPlay" data-active="false" type="button">
          <svg class="morph-svg" viewBox="0 0 24 24">
            <path id="playLeft" class="play-left" d="M7 4.5 L12 7.42 L12 16.58 L7 19.5 Z"/>
            <path id="playRight" class="play-right" d="M12 7.42 L19.5 11.8 L19.5 12.2 L12 16.58 Z"/>
          </svg>
          <span class="card-label" id="labelPlay">Paused</span>
        </button>

        <!-- 3. Add to list <-> Added (Plus to Check, 激活变绿) -->
        <button class="icon-card" id="cardPlus" data-active="false" type="button">
          <svg class="morph-svg" viewBox="0 0 24 24">
            <path id="plusV" class="plus-leg" d="M12 5 L12 19"/>
            <path id="plusH" class="plus-leg" d="M5 12 L19 12"/>
          </svg>
          <span class="card-label card-label-check" id="labelPlus">Add to list</span>
        </button>

        <!-- 4. Copy command <-> Copied! (Copy to Check, 激活变绿) -->
        <button class="icon-card" id="cardCopy" data-active="false" type="button">
          <svg class="morph-svg" viewBox="0 0 24 24">
            <path class="copy-back" d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            <rect class="copy-front" x="8" y="8" width="14" height="14" rx="2"/>
            <path class="copy-check-stroke" d="M5 12.5 L9.5 17 L19 7.5"/>
          </svg>
          <span class="card-label card-label-copy" id="labelCopy">Copy command</span>
        </button>

        <!-- 5. Light <-> Dark (Sun to Moon) -->
        <button class="icon-card" id="cardTheme" data-active="false" type="button">
          <svg class="morph-svg" viewBox="0 0 24 24">
            <defs>
              <mask id="moonMask">
                <rect x="-8" y="-8" width="40" height="40" fill="white"/>
                <circle class="moon-shadow-mask" cx="30" cy="-6" r="6.5" fill="black"/>
              </mask>
            </defs>
            <circle class="sun-core-crescent" cx="12" cy="12" r="4.5" mask="url(#moonMask)"/>
            <g class="sun-rays">
              <line x1="12" y1="2" x2="12" y2="4.5"/>
              <line x1="12" y1="19.5" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="4.5" y2="12"/>
              <line x1="19.5" y1="12" x2="22" y2="12"/>
              <line x1="4.93" y1="4.93" x2="6.7" y2="6.7"/>
              <line x1="17.3" y1="17.3" x2="19.07" y2="19.07"/>
              <line x1="4.93" y1="19.07" x2="6.7" y2="17.3"/>
              <line x1="17.3" y1="6.7" x2="19.07" y2="4.93"/>
            </g>
          </svg>
          <span class="card-label" id="labelTheme">Light</span>
        </button>

        <!-- 6. Show details <-> Hide details (Chevron 180°) -->
        <button class="icon-card" id="cardChevron" data-active="false" type="button">
          <svg class="morph-svg" viewBox="0 0 24 24">
            <polyline class="chevron-morph" points="6 9 12 15 18 9"/>
          </svg>
          <span class="card-label" id="labelChevron">Show details</span>
        </button>

        <!-- 7. Alerts on <-> Alerts off (Bell) -->
        <button class="icon-card" id="cardBell" data-active="false" type="button">
          <svg class="morph-svg" viewBox="0 0 24 24">
            <g class="bell-group">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </g>
            <line class="bell-slash" x1="4" y1="4" x2="20" y2="20"/>
          </svg>
          <span class="card-label" id="labelBell">Alerts on</span>
        </button>

        <!-- 8. 128 likes <-> 129 likes (Heart Pop + Burst Sparks) -->
        <button class="icon-card" id="cardHeart" data-active="false" type="button">
          <div class="heart-svg-frame">
            <svg class="morph-svg" viewBox="0 0 24 24">
              <!-- Burst 环形动画层 -->
              <circle class="burst-circle" cx="12" cy="12" r="4"/>
              
              <!-- 7 颗向外迸射的星点粒子 (角度对齐官方公式) -->
              <circle class="spark-dot" cx="12" cy="12" r="1.4" style="--sx: 0; --sy: -1;"/>
              <circle class="spark-dot" cx="12" cy="12" r="1.0" style="--sx: 0.782; --sy: -0.624;"/>
              <circle class="spark-dot" cx="12" cy="12" r="1.4" style="--sx: 0.975; --sy: 0.223;"/>
              <circle class="spark-dot" cx="12" cy="12" r="1.0" style="--sx: 0.434; --sy: 0.901;"/>
              <circle class="spark-dot" cx="12" cy="12" r="1.4" style="--sx: -0.434; --sy: 0.901;"/>
              <circle class="spark-dot" cx="12" cy="12" r="1.0" style="--sx: -0.975; --sy: 0.223;"/>
              <circle class="spark-dot" cx="12" cy="12" r="1.4" style="--sx: -0.782; --sy: -0.624;"/>

              <!-- 官方原生高保真 Lucide Heart 连续平滑贝塞尔曲线 (严禁硬截断) -->
              <path class="heart-shape" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
          </div>
          <span class="card-label card-label-heart" id="labelHeart">128 likes</span>
        </button>

      </div>
    </div>
  </main>

  <script>

      // 嵌入检测与主题同步
      const params = new URLSearchParams(window.location.search);
      const isEmbedded = window.self !== window.top || params.get('embed') === 'true';
      if (isEmbedded) {
        document.body.classList.add('is-embedded'); document.documentElement.classList.add('is-embedded');
      }
      const urlTheme = params.get('theme');
      if (urlTheme) {
        document.documentElement.dataset.theme = urlTheme;
      }
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'ARC_THEME_CHANGE' && e.data.theme) {
          document.documentElement.dataset.theme = e.data.theme;
        }
      });

    (function init() {
      // 1. 主题切换
      const root = document.documentElement;
      const themeBtn = document.getElementById('themeToggleBtn');
      function toggleTheme() {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('arc_theme', next); } catch (e) {}
      }
      themeBtn.addEventListener('click', toggleTheme);
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'd' || e.key === 'D') && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) toggleTheme();
      });

      // 2. Play <-> Pause 路径形态插值
      const cardPlay = document.getElementById('cardPlay');
      const pLeft = document.getElementById('playLeft');
      const pRight = document.getElementById('playRight');
      const labelPlay = document.getElementById('labelPlay');
      const PLAY_D = ["M7 4.5 L12 7.42 L12 16.58 L7 19.5 Z", "M12 7.42 L19.5 11.8 L19.5 12.2 L12 16.58 Z"];
      const PAUSE_D = ["M6.5 5 L10 5 L10 19 L6.5 19 Z", "M14 5 L17.5 5 L17.5 19 L14 19 Z"];

      cardPlay.addEventListener('click', () => {
        const isAct = cardPlay.dataset.active === 'true';
        const next = !isAct;
        cardPlay.dataset.active = String(next);
        pLeft.setAttribute('d', next ? PAUSE_D[0] : PLAY_D[0]);
        pRight.setAttribute('d', next ? PAUSE_D[1] : PLAY_D[1]);
        labelPlay.textContent = next ? 'Playing' : 'Paused';
      });

      // 3. Plus <-> Check (两笔画平滑转换为长短勾，附带绿色)
      const cardPlus = document.getElementById('cardPlus');
      const plusV = document.getElementById('plusV');
      const plusH = document.getElementById('plusH');
      const labelPlus = document.getElementById('labelPlus');
      cardPlus.addEventListener('click', () => {
        const isAct = cardPlus.dataset.active === 'true';
        const next = !isAct;
        cardPlus.dataset.active = String(next);
        plusV.setAttribute('d', next ? "M20 6.5 L9.5 17" : "M12 5 L12 19");
        plusH.setAttribute('d', next ? "M4.5 12 L9.5 17" : "M5 12 L19 12");
        labelPlus.textContent = next ? 'Added' : 'Add to list';
      });

      // 4. Copy <-> Check (绘制绿色对勾)
      const cardCopy = document.getElementById('cardCopy');
      const labelCopy = document.getElementById('labelCopy');
      cardCopy.addEventListener('click', () => {
        const isAct = cardCopy.dataset.active === 'true';
        const next = !isAct;
        cardCopy.dataset.active = String(next);
        labelCopy.textContent = next ? 'Copied!' : 'Copy command';
      });

      // 5. Menu <-> Close
      const cardMenu = document.getElementById('cardMenu');
      const labelMenu = document.getElementById('labelMenu');
      cardMenu.addEventListener('click', () => {
        const isAct = cardMenu.dataset.active === 'true';
        const next = !isAct;
        cardMenu.dataset.active = String(next);
        labelMenu.textContent = next ? 'Close' : 'Menu';
      });

      // 6. Theme (Light <-> Dark)
      const cardTheme = document.getElementById('cardTheme');
      const labelTheme = document.getElementById('labelTheme');
      cardTheme.addEventListener('click', () => {
        const isAct = cardTheme.dataset.active === 'true';
        const next = !isAct;
        cardTheme.dataset.active = String(next);
        labelTheme.textContent = next ? 'Dark' : 'Light';
      });

      // 7. Chevron (Show details <-> Hide details)
      const cardChevron = document.getElementById('cardChevron');
      const labelChevron = document.getElementById('labelChevron');
      cardChevron.addEventListener('click', () => {
        const isAct = cardChevron.dataset.active === 'true';
        const next = !isAct;
        cardChevron.dataset.active = String(next);
        labelChevron.textContent = next ? 'Hide details' : 'Show details';
      });

      // 8. Bell (Alerts on <-> Alerts off)
      const cardBell = document.getElementById('cardBell');
      const labelBell = document.getElementById('labelBell');
      cardBell.addEventListener('click', () => {
        const isAct = cardBell.dataset.active === 'true';
        const next = !isAct;
        cardBell.dataset.active = String(next);
        labelBell.textContent = next ? 'Alerts off' : 'Alerts on';
      });

      // 9. Heart Burst (128 likes <-> 129 likes)
      const cardHeart = document.getElementById('cardHeart');
      const labelHeart = document.getElementById('labelHeart');
      cardHeart.addEventListener('click', () => {
        const isAct = cardHeart.dataset.active === 'true';
        const next = !isAct;
        cardHeart.dataset.active = String(next);
        labelHeart.textContent = next ? '129 likes' : '128 likes';
      });
    })();
  </script>
</body>
</html>
